<meta name="description" content="El Perro, el truque de Fuenteguinaldo y Castillejo de Azaba. Juega en el Bar Doble J contra Tío Basilio o en pareja con Maribel.">

<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<meta name="application-name" content="El Perro">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='6' fill='%23fbf6e9' stroke='%23231d18' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23f0c53c' stroke='%23231d18' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c62d2a'/%3E%3C/svg%3E">
<title>El Perro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Una noche en el bar: la partida se ve como desde una cámara en la cabeza. Arriba, la pizarra con el tanteo en tiza;
   abajo, los cantos en posavasos de cartón. Un solo aspecto (oscuro) a propósito: es un bar de noche. */
:root {
  --noche: #120d0a;
  --panel: #2e2219;
  --panel-2: #3d2d21;
  --marfil: #f4eedf;
  --marfil-2: #dcd2bb;
  --papel: #f1ead8;
  --tinta: #221c15;
  --tinta-2: #6b6150;
  --texto: #f0e9d7;
  --texto-2: #b9b2a0;
  --oro: #e4b649;
  --oro-2: #f0cd78;
  --aviso: #e58258;
  --oros: #b07d17;
  --copas: #ad2d27;
  --espadas: #285a8f;
  --bastos: #3a6f33;
  --dorso: #7c2a24;
  --dorso-2: #66221d;
  --pizarra: #232c27;
  --tiza: #efebe1;
  --tiza-2: #b9b6ab;
  --tiza-nos: #f2d27a;
  --tiza-ellos: #a9cfe8;
  --marco: #5e3b1f;
  --f-display: "Alegreya SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-tiza: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --tilt: 11deg;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, #2a1d14, var(--noche) 70%) var(--noche);
  color: var(--texto);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* ---------- Naipes: la baraja española dibujada en naipes.js (símbolos SVG); aquí solo el cartón */
.card {
  --w: 74px;
  width: var(--w); height: calc(var(--w) * 1.48); flex: none;
  position: relative; display: inline-block; overflow: hidden;
  border-radius: calc(var(--w) * .075); border: 0; padding: 0; margin: 0;
  background: #fbf6e9; font: inherit; color: inherit; vertical-align: middle;
  box-shadow: 0 0 0 1px rgba(70,50,30,.38), 0 1px 0 rgba(0,0,0,.3), 0 5px 12px rgba(0,0,0,.28);
  user-select: none; -webkit-user-select: none;
}
button.card { appearance: none; -webkit-appearance: none; }
.card > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.card .dorso, .card.back .cara { display: none; }
.card.back .dorso { display: block; }
.card.sm { --w: 34px; }

/* ---------- Botones generales (menú y hojas) */
.btn {
  min-height: 44px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--oro);
  background: transparent; color: var(--texto); font-weight: 700; font-size: 15px; cursor: pointer; line-height: 1.15;
}
.btn:hover { background: rgba(228,182,73,.12); }
.btn.primary { background: var(--oro); color: var(--tinta); }
.btn.primary:hover { background: var(--oro-2); }
.btn:focus-visible { outline: 3px solid var(--oro-2); outline-offset: 2px; }
.btn small { display: block; font-weight: 500; font-size: 12.5px; opacity: .8; margin-top: 2px; }

/* ---------- La puerta del bar (menú de inicio) */
.screen { height: 100%; }
.bar-entrada { position: relative; height: 100%; }
.fachada-wrap { position: absolute; top: 0; bottom: 0; left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); overflow: hidden; background: #2a1d14; }
.fachada-wrap svg { display: block; width: 100%; height: 100%; transform-origin: var(--px, 50%) var(--py, 50%); transition: transform .8s cubic-bezier(.55,0,.8,.2); }
.fachada-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 42%, transparent 55%, rgba(6,4,2,.6) 100%); }
.bar-entrada::after { content: ''; position: absolute; inset: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); pointer-events: none; opacity: 0; transition: opacity .55s .3s ease-in;
  background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), #ffe0a0, #c27b36 35%, #120d0a 75%); }
.bar-entrada.entrando .fachada-wrap svg { transform: scale(2.6); }
.bar-entrada.entrando::after { opacity: 1; }
.bar-entrada.entrando .menu-capa { opacity: 0; transform: translateY(14px) scale(.97); }
.menu-capa { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; transition: opacity .3s, transform .3s;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.menu-col { width: min(100%, 410px); padding-top: var(--tope, 110px); display: grid; gap: 4px; }

/* El papel de «Se buscan jugadores», pegado con celo en la esquina de la pizarra: la mesa con amigos */
.nota-mesa {
  position: absolute; z-index: 3; left: -12px; top: -16px; width: 94px; padding: 10px 6px 0; border: 0; cursor: pointer;
  color: #2a241d; transform: rotate(-8deg); transform-origin: 60% 0; transition: transform .2s ease;
  background: #fbf6e9 linear-gradient(rgba(60,90,140,.09) 1px, transparent 1px) 0 6px / 100% 9px;
  box-shadow: 1px 2px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.45);
  font-family: var(--f-display); text-align: center; line-height: 1;
}
.nota-mesa::before { content: ''; position: absolute; top: -8px; left: 50%; width: 42px; height: 15px; margin-left: -21px; background: rgba(240,222,160,.82); transform: rotate(4deg); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.nota-mesa b { display: block; font-size: 14.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; color: #a8281f; }
.nota-mesa small { display: block; margin-top: 4px; font: 700 10.5px/1.15 var(--f-body); color: #3d3226; }
.nota-mesa .tiras { display: flex; margin: 6px -6px 0; border-top: 1.5px dashed #c9b892; }
.nota-mesa .tiras i { flex: 1; height: 32px; border-right: 1px dashed #c9b892; font: 800 7.5px/1 var(--f-body); writing-mode: vertical-rl; color: #6b5b45; font-style: normal; padding-top: 3px; overflow: hidden; }
.nota-mesa .tiras i:last-child { border-right: 0; }
.nota-mesa .tiras i.arrancada { visibility: hidden; }
.nota-mesa:hover { transform: rotate(-5deg) translateY(-2px); }
.nota-mesa:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }

/* La mesa del fondo: la hoja para jugar con amigos */
.mesa-intro { color: var(--tinta-2); margin-top: -4px; }
.campo { display: grid; gap: 5px; font-weight: 700; }
.campo input, .codigo-input { width: 100%; box-sizing: border-box; font: 600 17px var(--f-body); padding: 10px 12px; border: 1.5px solid #cfc4ad; border-radius: 10px; background: #fffaf0; color: var(--tinta); }
.campo input:focus, .codigo-input:focus { outline: 3px solid rgba(217,169,58,.6); outline-offset: 1px; }
.mesa-dos { display: grid; gap: 10px; margin-top: 12px; }
@media (min-width: 560px) { .mesa-dos { grid-template-columns: 1fr 1fr; } }
.mesa-op { display: grid; gap: 7px; align-content: start; padding: 12px; border-radius: 12px; background: rgba(107,68,35,.06); border: 1.5px dashed #cfc4ad; }
.mesa-op b { font-family: var(--f-display); font-size: 17px; }
.mesa-op span { font-size: 14px; color: var(--tinta-2); }
.mesa-op.destacada { border-style: solid; border-color: #d9a93a; background: rgba(242,210,122,.18); }
.codigo-input { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; }
.enlace-ayuda { display: inline-block; margin-top: 12px; padding: 4px 0; border: 0; background: none; color: #6b4423; font: 700 15px var(--f-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.enlace-ayuda:hover { color: #a8281f; }
.codigo-mesa { display: inline-block; padding: 1px 10px 2px; border-radius: 8px; background: var(--pizarra); color: #fffaf0; letter-spacing: .14em; font-family: var(--f-display); }
.mesa-invitar { display: flex; flex-wrap: wrap; gap: 8px; }
.sillas { position: relative; width: 100%; height: 236px; margin: 14px auto 4px; max-width: 340px; }
.sillas-2 { height: 206px; }
.mesita-sala { position: absolute; left: 50%; top: 50%; width: 118px; height: 80px; margin: -40px 0 0 -59px; border-radius: 8px; background: #2f5c3e; border: 6px solid #6b4423; box-shadow: inset 0 0 14px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.25); }
.mesita-sala span { position: absolute; font: 800 9.5px var(--f-body); text-transform: uppercase; letter-spacing: .06em; }
.mesita-sala .pa { left: 5px; top: 5px; color: #f2d27a; }
.mesita-sala .pb { right: 5px; bottom: 5px; color: #a9c7e8; }
.silla { position: absolute; min-width: 84px; max-width: 112px; padding: 6px 10px; border-radius: 12px; border: 2px solid #cfc4ad; background: #fffaf0; color: var(--tinta); display: grid; justify-items: center; gap: 1px; font-family: var(--f-body); box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: transform .15s ease; }
.silla:disabled { cursor: default; opacity: 1; }
.silla:not(:disabled) { cursor: pointer; }
.silla b { font-size: 15px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.silla small { font-size: 11px; color: var(--tinta-2); }
.silla.libre { border-style: dashed; background: rgba(255,250,240,.6); }
.silla.libre b { color: var(--tinta-2); font-weight: 600; }
.silla.mia { box-shadow: 0 0 0 3px rgba(217,169,58,.6), 0 2px 4px rgba(0,0,0,.15); }
.silla.pareja-a { border-color: #d9a93a; }
.silla.pareja-b { border-color: #6f97c4; }
.silla.sel { border-color: #a8281f; transform: scale(1.06); }
.silla.abajo { left: 50%; bottom: 0; translate: -50% 0; }
.silla.arriba { left: 50%; top: 0; translate: -50% 0; }
.silla.izquierda { left: 0; top: 50%; translate: 0 -50%; }
.silla.derecha { right: 0; top: 50%; translate: 0 -50%; }
.mesa-ajustes { display: grid; gap: 8px; justify-items: center; margin: 10px 0 4px; }
.mesa-modo-txt { text-align: center; color: var(--tinta-2); font-weight: 700; }
.btn.grande { display: block; width: 100%; font-size: 19px; padding: 13px; margin-top: 8px; }
.nota-sala, .de-pie { font-size: 13.5px; color: var(--tinta-2); text-align: center; margin: 6px 0; }
.espera-red { text-align: center; font-weight: 700; color: #6b4423; margin: 8px 0; }
.pasos-mesa { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 12px; }
.paso-mesa { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: center; }
.paso-mesa .dibu svg { width: 108px; height: 76px; display: block; border-radius: 10px; background: #e9dfca; }
.paso-mesa b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 2px; }
.paso-mesa b i { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: var(--tinta); color: #fbf3e2; font: 800 13px var(--f-body); vertical-align: 1px; }
.paso-mesa span { font-size: 14px; color: var(--tinta-2); line-height: 1.35; }
.tag.fuera-red { background: #5c4a35; color: #f4ecd8; }

/* El caballete con la pizarra */
.caballete { position: relative; padding-bottom: 40px; margin: 0; }
.caballete::before, .caballete::after { content: ''; position: absolute; top: 18px; bottom: 0; width: 15px; border-radius: 4px; z-index: 0; transform-origin: 50% 0;
  background: linear-gradient(90deg, #3e2614, #7a5030 45%, #4a2f19); box-shadow: 0 8px 12px rgba(0,0,0,.45); }
.caballete::before { left: 13%; transform: rotate(7deg); }
.caballete::after { right: 13%; transform: rotate(-7deg); }
.pizarra-menu {
  position: relative; z-index: 1; text-align: center;
  padding: 12px 16px 16px; border-radius: 10px; border: 9px solid #6b4423;
  background:
    radial-gradient(45% 35% at 25% 20%, rgba(255,255,255,.06), transparent 70%),
    radial-gradient(40% 30% at 80% 75%, rgba(255,255,255,.05), transparent 70%),
    radial-gradient(30% 20% at 60% 40%, rgba(255,255,255,.035), transparent 70%),
    var(--pizarra);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.4), inset 0 0 26px rgba(0,0,0,.6), 0 0 0 2px #4a2d16, 0 18px 30px rgba(0,0,0,.55);
  color: var(--tiza); font-family: var(--f-tiza);
}
.pizarra-menu::after { content: ''; position: absolute; left: -12px; right: -12px; bottom: -20px; height: 12px; border-radius: 3px; background: linear-gradient(#7a5030, #4a2f19); box-shadow: 0 4px 8px rgba(0,0,0,.5); }
.pizarra-menu::before { content: ''; position: absolute; left: 22%; bottom: -15px; width: 34px; height: 6px; border-radius: 3px; background: #f1ede2; box-shadow: 44px 1px 0 -1px #f2d27a; }
.hoy { margin: 0; font-size: 21px; line-height: 1; color: var(--tiza-2); }
.titulo-tiza { margin: 0; font-family: var(--f-tiza); font-weight: 700; font-size: clamp(50px, 15vw, 62px); line-height: .92; color: #fffaf0; text-shadow: 0 0 2px rgba(255,255,255,.45); display: flex; align-items: center; justify-content: center; gap: 10px; }
.titulo-tiza svg { width: 26px; height: 26px; opacity: .85; }
.titulo-tiza .izq { color: #9fc7e8; transform: rotate(-12deg); } .titulo-tiza .der { color: #f0a29a; transform: rotate(10deg); }
.sub-tiza { margin: 2px 0 0; font-size: 17px; line-height: 1.1; color: var(--tiza-2); }
.raya-tiza { height: 2px; margin: 10px 8px 8px; background: repeating-linear-gradient(90deg, rgba(239,235,225,.45) 0 14px, transparent 14px 20px); border-radius: 2px; }
.tiza-grupo { border: 0; margin: 0 0 8px; padding: 0; min-width: 0; }
.tiza-grupo legend { padding: 0; margin: 0 auto 4px; font-size: 22px; line-height: 1.1; color: var(--tiza-nos); }
.tiza-grupo legend i { font-style: normal; display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 6px; border: 2px solid currentColor; border-radius: 50% 46% 52% 48%; font-size: 18px; }
.oculto { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.modos-tiza { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opcion-tiza { position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 6px 9px; border-radius: 12px; cursor: pointer; color: var(--tiza-2); transition: color .15s; }
.opcion-tiza:hover { color: var(--tiza); }
.opcion-tiza .mesa-tiza { width: 78px; height: 52px; overflow: visible; }
.opcion-tiza b { font-size: 26px; line-height: 1; color: var(--tiza); font-weight: 700; }
.opcion-tiza small { font-size: 16.5px; line-height: 1.05; }
/* El círculo de tiza alrededor de lo elegido */
.opcion-tiza::before, .opcion-tiza::after { content: ''; position: absolute; pointer-events: none; opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
.opcion-tiza::before { inset: 0; border: 2.6px solid var(--tiza-nos); border-radius: 18px 26px 15px 28px / 26px 15px 28px 18px; transform: scale(.9) rotate(-2deg); box-shadow: 0 0 5px rgba(242,210,122,.35); }
.opcion-tiza::after { inset: 3px -3px -2px 4px; border: 1.4px solid rgba(242,210,122,.55); border-radius: 26px 16px 28px 15px / 15px 28px 18px 26px; transform: scale(.9) rotate(1deg); }
.duracion-tiza .opcion-tiza::before { border-radius: 50% 46% 52% 48% / 52% 50% 48% 50%; }
.duracion-tiza .opcion-tiza::after { border-radius: 48% 52% 46% 50% / 50% 46% 52% 48%; }
input:checked + .opcion-tiza { color: var(--tiza); }
input:checked + .opcion-tiza b { color: var(--tiza-nos); }
input:checked + .opcion-tiza::before { opacity: 1; transform: rotate(-1.2deg); }
input:checked + .opcion-tiza::after { opacity: 1; transform: rotate(.8deg); }
input:focus-visible + .opcion-tiza { outline: 2px dashed var(--tiza); outline-offset: 3px; }
.duracion-tiza { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; }
.duracion-tiza .opcion-tiza { padding: 5px 12px 7px; }
.duracion-tiza .opcion-tiza b { font-size: 21px; }
.duracion-tiza .opcion-tiza small { font-size: 15.5px; }
.entrar-tiza {
  position: relative; width: 100%; margin-top: 6px; padding: 8px 14px 10px; border: 0; cursor: pointer;
  font-family: var(--f-tiza); font-weight: 700; font-size: 33px; line-height: 1; color: #2b1d0c;
  border-radius: 14px 18px 12px 20px;
  background: repeating-linear-gradient(-58deg, rgba(255,255,255,.18) 0 3px, transparent 3px 7px), #f2cf6e;
  box-shadow: 0 0 0 2px rgba(242,207,110,.35), 0 0 18px rgba(242,207,110,.35);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  animation: llama 2.4s ease-in-out infinite;
}
.entrar-tiza svg { width: 34px; height: 24px; }
.entrar-tiza small { display: block; font-size: 17px; font-weight: 500; opacity: .8; }
.entrar-tiza:hover { filter: brightness(1.06); }
.entrar-tiza:active { transform: translateY(1px) scale(.99); }
.entrar-tiza:focus-visible { outline: 3px dashed var(--tiza); outline-offset: 4px; }
@keyframes llama { 0%, 100% { box-shadow: 0 0 0 2px rgba(242,207,110,.35), 0 0 14px rgba(242,207,110,.3); } 50% { box-shadow: 0 0 0 2px rgba(242,207,110,.5), 0 0 26px rgba(242,207,110,.55); } }

/* En horizontal, la pizarra a la izquierda (delante de las ventanas) y la puerta a la vista */
.bar-entrada.horizontal .menu-capa { align-items: flex-start; justify-content: center; padding-left: clamp(24px, 6vw, 110px); }
.bar-entrada.horizontal .menu-col { padding-top: 0; }

/* La mesa de la terraza con los posavasos */
.mesita { position: relative; display: flex; justify-content: center; gap: 26px; padding: 10px 0 16px; }
.mesita::before { content: ''; position: absolute; left: 7%; right: 7%; top: 30px; bottom: 6px; z-index: 0; border-radius: 12px;
  background: linear-gradient(#f5f3ee, #d9d5cb); box-shadow: 0 6px 0 #c3beb3, 0 18px 26px rgba(0,0,0,.55);
  transform: perspective(520px) rotateX(42deg); transform-origin: 50% 100%; }
.mesita .pv { z-index: 1; }
.pv.pv-menu { width: 104px; height: 104px; font-size: 13px; gap: 3px; box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 5.5px var(--t), inset 0 0 0 7px var(--c), 0 3px 0 rgba(0,0,0,.3), 0 12px 18px rgba(0,0,0,.5); }
.pv-menu svg { width: 38px; height: 30px; overflow: visible; }
.pv-cartas { --c: #efe5cf; --t: #a8281f; }
.pv-ajustes { --c: #efe5cf; --t: #24508a; }

@media (max-width: 520px) {
  .menu-col { width: min(100%, 380px); }
  .pizarra-menu { padding: 8px 12px 12px; border-width: 8px; }
  .hoy { font-size: 18px; }
  .titulo-tiza { font-size: 46px; }
  .titulo-tiza svg { width: 22px; height: 22px; }
  .sub-tiza { font-size: 14.5px; }
  .raya-tiza { margin: 7px 8px 6px; }
  .tiza-grupo { margin-bottom: 6px; }
  .tiza-grupo legend { font-size: 19.5px; }
  .tiza-grupo legend i { width: 23px; height: 23px; font-size: 16px; }
  .opcion-tiza { padding: 4px 4px 7px; }
  .opcion-tiza .mesa-tiza { width: 62px; height: 40px; }

.equipo { position: relative; display: grid; grid-template-columns: auto minmax(30px, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 8px; row-gap: 0; min-width: 0; color: var(--tc); }

.mundo.sin-cartas .pulgar, .mundo.sin-cartas .palma { display: none; }
.mundo:not(.sin-cartas) .izq-reposo { display: none; }
.abanico .yemas-fan { position: absolute; left: calc(var(--x) - 40px); top: calc(var(--y) - 59px); width: 80px; height: 118px; transform: rotate(var(--r)); pointer-events: none; }
.yemas-svg { position: absolute; right: -11px; top: 54px; overflow: visible; }
.vuelo { position: absolute; width: 50px; height: 74px; pointer-events: none; z-index: 5; }
.vuelo-carta { position: absolute; inset: 0; }
.vuelo-carta .card { left: 0; top: 0; }
.vuelo-mano { position: absolute; left: 0; top: 0; width: 50px; height: 74px; transform-origin: 50% 50%; }
.mano-vuelo-svg { position: absolute; overflow: visible; }

/* El puñetazo en la mesa del que pierde */
.mesazo { position: absolute; width: 0; height: 0; pointer-events: none; }
.mesazo-puno { position: absolute; left: -36px; top: -42px; width: 72px; height: 96px; transform-origin: 36px 42px; opacity: 0; }
.mesazo-puno svg { display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.mesazo-sombra { position: absolute; left: -30px; top: -22px; width: 60px; height: 52px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); opacity: 0; }
.mesazo-onda { position: absolute; left: -50px; top: -50px; width: 100px; height: 100px; opacity: 0; }
.mesazo-onda svg { display: block; width: 100%; height: 100%; overflow: visible; fill: none; stroke: rgba(255,244,214,.75); stroke-width: 3.5; stroke-linecap: round; }

/* Etiquetas con el nombre de cada uno */
.etiqueta { position: absolute; display: grid; gap: 3px; font-size: 16px; white-space: nowrap; }
.etiqueta.al-center { transform: translateX(-50%); justify-items: center; }
.etiqueta.al-end { transform: translateX(-100%); justify-items: end; }
.etiqueta.fuera { opacity: .55; }
.seat-head { display: inline-flex; align-items: center; gap: 5px; background: rgba(14, 11, 8, .62); border-radius: 999px; padding: 3px 10px 3px 8px; }
.seat-head b { font-family: var(--f-display); font-size: 17px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; }
.dot.t-nos { --tc: var(--tiza-nos); } .dot.t-ellos { --tc: var(--tiza-ellos); }
.tags { display: flex; gap: 4px; padding-inline: 4px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: rgba(14,11,8,.72); color: var(--texto-2); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.tag.turno { background: var(--oro); color: var(--tinta); }
.tag.reparte { background: #efe5cf; color: #6b2a1f; }
.tag svg { width: 13px; height: 11px; fill: #fbf6e9; stroke: #a8281f; stroke-width: 1.1; }
.globo { display: inline-block; justify-self: inherit; background: var(--papel); color: var(--tinta); font-weight: 800; font-size: 15px; padding: 1px 8px; border-radius: 9px 11px 9px 3px; }
.globo.flor { background: var(--oro); }
.sena { font-family: var(--f-tiza); font-size: 17px; line-height: 1.1; color: var(--oro-2); }
/* La tuya va en una sola línea, para que el globo no tape tus cartas */
.etiqueta[data-lado="bottom"] { display: flex; align-items: center; gap: 6px; transform: translateX(-50%); }
.etiqueta[data-lado="bottom"] .tags { padding: 0; }

/* Los puntos del suelo: qué jugada del reparto va. Un círculo vacío por jugada que se rellena cuando empieza */
.punto {
  position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  border: 2.5px solid rgba(239,229,207,.6); background: rgba(20,15,11,.35);
  box-shadow: 0 1px 2px rgba(0,0,0,.45); transition: border-color .4s ease, box-shadow .5s ease;
}
.punto::after {
  content: ''; position: absolute; inset: 2px; border-radius: 50%; background: #efe5cf;
  transform: scale(0); transition: transform .55s cubic-bezier(.3,1.5,.5,1) .15s, background-color .4s ease, opacity .4s ease;
}
.punto.llena { border-color: rgba(239,229,207,.7); }
.punto.llena::after { transform: scale(1); background: #b9ad99; }
.punto.actual { border-color: #f2d27a; box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 0 12px 3px rgba(242,210,122,.5); }
.punto.actual::after { background: #efe5cf; }

/* El cenicero */
.cenicero { position: absolute; width: 180px; height: 180px; pointer-events: none; }
.cenicero svg { position: absolute; inset: 0; overflow: visible; }
.cenicero .seg-num { position: absolute; left: 34px; top: 140px; font-family: var(--f-tiza); font-weight: 700; font-size: 24px; color: var(--oro-2); text-shadow: 0 1px 3px rgba(0,0,0,.9); font-variant-numeric: tabular-nums; }
#cig-brasa { opacity: .55; transition: opacity .3s; }
.cenicero.activo #cig-brasa { opacity: 1; }
.cenicero.apurando #cig-brasa { animation: aviva .7s ease-in-out infinite alternate; }
@keyframes aviva { from { opacity: .75; } to { opacity: 1; } }
.cenicero.apagado #cig-brasa, .cenicero.apagado #cig-ceniza { opacity: 0; }
.cenicero.nuevo #cig-cig { animation: enciende .45s ease-out; }
@keyframes enciende { from { opacity: 0; } to { opacity: 1; } }
.humo { position: absolute; width: 0; height: 0; pointer-events: none; }
.humo i { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, rgba(226,223,216,.5), rgba(226,223,216,0) 70%); filter: blur(2px); opacity: 0; animation: humo 3.4s linear infinite; }
.humo i:nth-child(2) { animation-delay: .7s; --dx: -16px; }
.humo i:nth-child(3) { animation-delay: 1.4s; --dx: 14px; }
.humo i:nth-child(4) { animation-delay: 2.1s; --dx: -6px; }
.humo i:nth-child(5) { animation-delay: 2.8s; --dx: 20px; }
@keyframes humo {
  0% { opacity: 0; transform: translate(0, 0) scale(.45); }
  14% { opacity: .8; }
  55% { opacity: .38; transform: translate(calc(var(--dx, 8px) * .6), -46px) scale(1.8); }
  100% { opacity: 0; transform: translate(var(--dx, 8px), -88px) scale(2.9); }
}
.cenicero:not(.activo) .humo i { animation-duration: 4.8s; }
.cenicero.apagado .humo { display: none; }

/* Luz de la lámpara y viñeta de la cámara */
.luz { position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background:
    radial-gradient(60% 52% at 50% 38%, rgba(255,214,150,.12), transparent 70%),
    radial-gradient(130% 110% at 50% 46%, transparent 52%, rgba(6,4,2,.62) 100%); }

/* Carteles: ¡Truque!, ¡Envido!, ¡Flor!... Entran de golpe (con onda y chispas), se quedan lo justo para leerlos
   y salen volando. Tocándolos se pasa al siguiente. */
.anuncio { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; }
.cartel {
  --c: var(--copas); --dur: 2400ms;
  position: relative; display: grid; justify-items: center; gap: 2px; overflow: visible;
  padding: 10px 22px 12px; border-radius: 14px 18px 12px 20px;
  background: var(--c); color: #fff8e8; border: 3px solid #fff3d6;
  box-shadow: 0 0 0 4px var(--c), 0 18px 40px rgba(0,0,0,.6);
  text-align: center; max-width: 92%; pointer-events: auto; cursor: pointer;
  animation: cartel-entra .5s cubic-bezier(.2,.9,.3,1.3) both, cartel-sale .34s cubic-bezier(.5,0,.9,.4) calc(var(--dur) - .34s) forwards;
}
.cartel::before { content: ''; position: absolute; inset: -6px; border-radius: inherit; border: 4px solid var(--c); opacity: 0; pointer-events: none; animation: onda .7s ease-out .08s; }
.cartel::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 48%, transparent 60%) no-repeat; background-size: 250% 100%; background-position: 130% 0;
  animation: brillo .9s ease-out .35s; }
.cartel.corto::before { display: none; }
.cartel.saliendo { animation: cartel-sale .22s cubic-bezier(.5,0,.9,.4) forwards; }
.cartel b { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 11vw, 64px); line-height: .95; letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.cartel span { font-weight: 800; font-size: 15px; }
.cartel.k-envido { --c: var(--espadas); } .cartel.k-truque { --c: var(--copas); } .cartel.k-flor { --c: #a87612; }
.cartel.k-falta { --c: #1c1612; border-color: var(--aviso); box-shadow: 0 0 0 4px var(--aviso), 0 18px 40px rgba(0,0,0,.6); }
.cartel.k-quiero { --c: var(--bastos); } .cartel.k-no { --c: #4a4339; }
@keyframes cartel-entra {
  0% { opacity: 0; transform: scale(2) rotate(-10deg); filter: blur(3px); }
  45% { opacity: 1; transform: scale(.92) rotate(-3deg); filter: blur(0); }
  70% { transform: scale(1.04) rotate(-4.5deg); }
  100% { opacity: 1; transform: scale(1) rotate(-4deg); }
}
@keyframes cartel-sale {
  0% { opacity: 1; transform: scale(1) rotate(-4deg); filter: blur(0); }
  100% { opacity: 0; transform: translateY(-46px) scale(.72) rotate(-9deg); filter: blur(3px); }
}
@keyframes onda { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes brillo { from { background-position: 130% 0; } to { background-position: -40% 0; } }
.chispas { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 2; }
.chispas i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #ffe7a6; box-shadow: 0 0 10px 3px rgba(255,200,90,.75); opacity: 0;
  animation: chispa var(--t) cubic-bezier(.2,.7,.3,1) .05s forwards; }
.chispas i:nth-child(3n) { width: 5px; height: 5px; background: #fff; }
.chispas i:nth-child(4n) { background: #ff9f6a; box-shadow: 0 0 8px 2px rgba(255,120,60,.6); }
@keyframes chispa {
  0% { opacity: 1; transform: rotate(var(--a)) translateX(70px) scale(1.2); }
  55% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(.35); }
}
/* Aviso de que te han cantado algo (se queda mientras decides, abajo, para no tapar a nadie) */
.reto-capa { position: absolute; bottom: 10px; left: 0; right: 0; z-index: 7; display: grid; justify-items: center; pointer-events: none; padding-inline: 10px; }
.reto { --c: var(--copas); display: grid; justify-items: center; gap: 1px; max-width: 100%; padding: 6px 16px 8px; border-radius: 12px 16px 10px 18px; background: var(--c); color: #fff8e8; border: 2.5px solid #fff3d6; box-shadow: 0 0 0 3px var(--c), 0 10px 24px rgba(0,0,0,.55); text-align: center; transform: rotate(-1.4deg); }
.reto b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.reto span { font-size: 13.5px; font-weight: 700; }
/* Elegir cuánto se sube («Y yo»): sale encima de tus cartas */
.subida {
  pointer-events: auto; display: grid; justify-items: center; gap: 6px; width: min(100%, 360px);
  padding: 10px 14px 12px; border-radius: 14px 18px 12px 16px; background: #f4ecd8; color: var(--tinta);
  box-shadow: 0 0 0 2px #d9a93a, 0 12px 30px rgba(0,0,0,.6); transform: rotate(-.8deg);
}
.subida.nueva { animation: subida-entra .22s ease-out; }
/* Mientras eliges, el selector va en el centro de la mesa, para que veas tus cartas */
.menu-list .btn .aviso-salir { display: block; font-size: 12px; font-weight: 500; opacity: .8; margin-top: 2px; }
/* Mesa con amigos: avisos solo para quien la abrió (devolver una silla) */
.avisos-red { position: absolute; top: 8px; left: 8px; z-index: 8; display: grid; gap: 6px; max-width: min(78%, 360px); }
.avisos-red:empty { display: none; }
.aviso-red { text-align: left; font: inherit; font-size: 13px; line-height: 1.3; color: #2a1f10; background: #f4ecd8; border: 1.5px solid var(--oro); border-radius: 10px;
  padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.4); cursor: pointer; }
.aviso-red b { display: block; margin-top: 2px; color: #6b3d0c; }
.reto-capa:has(.subida) { bottom: auto; top: 50%; transform: translateY(-56%); }
.subida .btn { background: transparent; color: var(--tinta); border: 1.5px solid #b9a888; }
.subida .btn.primary { background: var(--tinta); color: #fbf3e2; border-color: var(--tinta); }
@keyframes subida-entra { from { opacity: 0; transform: translateY(14px) rotate(-.8deg) scale(.96); } }
.subida-titulo { font-family: var(--f-display); font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: #6b4a12; }
.subida-num { display: flex; align-items: center; gap: 16px; }
.subida-num output { min-width: 92px; text-align: center; font: 800 48px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--tinta); }
.subida-num output small { font-size: 30px; color: #8a6a2a; margin-right: 1px; }
.chapa.grande { position: static; width: 46px; height: 46px; font-size: 26px; line-height: 46px; touch-action: manipulation; }
.chapa.grande:disabled { opacity: .35; cursor: default; filter: grayscale(.6); }
.subida-van { font-size: 14px; color: #5c4a35; text-align: center; }
.subida-van b { font-size: 16px; color: var(--tinta); }
.subida-rapidas { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.ficha {
  width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; font: 800 14px/1 var(--f-body); color: #fff8e8;
  background: radial-gradient(circle, #2a6b47 0 52%, transparent 53%), repeating-conic-gradient(#2a6b47 0 20deg, #f4ecd8 20deg 40deg);
  box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.15); touch-action: manipulation;
}
.ficha.sel { background: radial-gradient(circle, #a8281f 0 52%, transparent 53%), repeating-conic-gradient(#a8281f 0 20deg, #f4ecd8 20deg 40deg); transform: translateY(-2px); }
.ficha:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.subida-acts { display: flex; gap: 8px; margin-top: 2px; }
.subida-acts .btn { padding: 9px 14px; }
.pv.abierto { box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 5.5px var(--t), inset 0 0 0 7px var(--c), 0 0 0 3px #fff3d6, 0 8px 16px rgba(0,0,0,.5); }
.reto.k-envido { --c: var(--espadas); } .reto.k-flor { --c: #a87612; } .reto.k-falta { --c: #1c1612; border-color: var(--aviso); }

/* Abajo: información y posavasos */
.acciones { display: grid; justify-items: center; align-content: start; gap: 6px; min-height: 112px; }
.info { margin: 0; min-height: 20px; font-size: 13.5px; color: var(--texto-2); text-align: center; }
.info b { color: var(--oro-2); }
.info .aviso { color: var(--aviso); font-weight: 700; }
.posavasos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 12px; min-height: 80px; }
.pv {
  --c: #efe5cf; --t: #2a4f86; --r: 0deg;
  position: relative; width: 72px; height: 72px; border-radius: 50%; border: 0; padding: 0; flex: none;
  display: grid; place-content: center; justify-items: center; gap: 2px; text-align: center;
  background-color: var(--c);
  background-image: radial-gradient(circle at 34% 28%, rgba(255,255,255,.2), transparent 60%), var(--tex-carton, none);
  background-size: 100% 100%, 72px 72px;
  background-blend-mode: normal, multiply;
  color: var(--t);
  box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 5.5px var(--t), inset 0 0 0 7px var(--c), 0 2px 0 rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.5);
  transform: rotate(var(--r));
  font-family: var(--f-display); font-weight: 800; font-size: 13px; line-height: .95; text-transform: uppercase; letter-spacing: .01em;
  cursor: pointer; transition: transform .12s ease;
}
.pv:hover { transform: rotate(var(--r)) translateY(-3px); }
.pv:active { transform: rotate(var(--r)) translateY(1px) scale(.97); }
.pv:focus-visible { outline: 3px solid var(--oro-2); outline-offset: 3px; }
.pv small { font-family: var(--f-body); text-transform: none; font-weight: 800; font-size: 10.5px; letter-spacing: 0; opacity: .85; }
.pv.cuadrado { border-radius: 12px 14px 11px 15px; }
.pv-envido { --c: #efe5cf; --t: #24508a; }
.pv-truque { --c: #efe5cf; --t: #a8281f; }
.pv-ambos { --c: #e7dcc0; --t: #5b2a55; font-size: 11px; }
.pv-mazo { --c: #b9ad99; --t: #3a3229; }
.pv-quiero { --c: #2f6b3a; --t: #f3ecd8; }
.pv-no { --c: #efe5cf; --t: #2a241d; }
.pv-subir { --c: #d9a93a; --t: #2a1f10; }
.pv-falta { --c: #1f1a16; --t: #ee8a55; }
.pv-flor { --c: #e4b649; --t: #2a1f10; width: 84px; height: 84px; font-size: 19px; }
.pv-pasar { --c: #b9ad99; --t: #3a3229; }
.pv-grupo { position: relative; display: inline-grid; flex: none; }
.chapa {
  position: absolute; bottom: -6px; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: radial-gradient(circle, #b8322a 0 58%, transparent 59%), repeating-conic-gradient(#c9c2b3 0 9deg, #8f887c 9deg 18deg);
  color: #fff4dc; font-weight: 800; font-size: 19px; line-height: 30px; text-align: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.5);
}
.chapa.menos { left: -12px; } .chapa.mas { right: -12px; }
.chapa:hover { filter: brightness(1.12); }
.chapa:focus-visible { outline: 3px solid var(--oro-2); outline-offset: 2px; }
.espera { font-style: italic; }

@media (min-width: 1000px) {
  .acciones {
    position: absolute; right: 26px; bottom: 26px; z-index: 9; width: 286px; min-height: 0;
    padding: 12px 12px 16px; border-radius: 16px; background: rgba(18, 12, 8, .66); box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .juego { grid-template-rows: auto minmax(0, 1fr); }
  .pizarra { width: min(100%, 880px); justify-self: center; column-gap: 18px; }
  .posavasos { min-height: 84px; }
  .posavasos:empty { display: none; }
  .pv { width: 78px; height: 78px; font-size: 15px; }
  .pv-flor { width: 92px; height: 92px; }
}
@media (max-width: 520px) {
  .pizarra { column-gap: 7px; padding: 3px 5px 4px; }
  .pz-btn { min-width: 44px; min-height: 42px; padding: 3px 3px 2px; font-size: 10.5px; }
  .pz-btn svg { width: 18px; height: 18px; }
  .equipo { column-gap: 6px; }
  .equipo .nombre { font-size: 12px; letter-spacing: .04em; }
  .equipo .malas { font-size: 11px; }
  .equipo .num { font-size: 24px; }
  .chip-pz { font-size: 12px; padding: 1px 8px; }
  .pv { width: 66px; height: 66px; font-size: 12px; }
  .pv-flor { width: 78px; height: 78px; font-size: 17px; }
  .posavasos { gap: 8px 10px; min-height: 74px; }
  .acciones { min-height: 104px; }
  .reto b { font-size: 20px; }
  .reto span { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .cartel { opacity: 1; transform: rotate(-4deg); }
  .chispas { display: none; }
  .humo { display: none; }
}

/* ---------- Hojas (resumen, menú, ayuda) */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(12, 8, 5, .62); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(100%, 580px); max-height: 100%; overflow-y: auto; background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 18px 18px 16px; box-shadow: 0 18px 50px rgba(0,0,0,.5); display: grid; gap: 14px; }
.sheet h2 { font-size: 24px; font-weight: 800; }
.sheet h3 { font-size: 16px; font-weight: 800; letter-spacing: .03em; color: var(--tinta-2); }
.sheet p { margin: 0; }
.sheet .btn { color: var(--tinta); border-color: var(--tinta); background: transparent; }
.sheet .btn:hover { background: rgba(34,28,21,.06); }
.sheet .btn.primary { background: var(--tinta); color: var(--papel); }
.sheet .btn.primary:hover { background: #3b3025; }
.sheet-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tabla-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; color: inherit; font-family: inherit; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #d6ccb4; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-2); font-weight: 800; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.skip td { color: var(--tinta-2); text-decoration: line-through; }
.mini-cards { display: inline-flex; gap: 3px; vertical-align: middle; }
.mini-cards .card { --w: 30px; }
.sheet .card.gana { outline: 2px solid var(--oro); outline-offset: 2px; }

<script>
/* El Perro — motor de reglas (sin interfaz).
   Reglas según el documento "Reglas del Perro (truco de Fuenteguinaldo)". */
(function (root) {
'use strict';

// ---------------------------------------------------------------- Baraja
const SUITS = ['oros', 'copas', 'espadas', 'bastos'];
const RANKS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
const RANK_NAME = { 1: 'as', 2: 'dos', 3: 'tres', 4: 'cuatro', 5: 'cinco', 6: 'seis', 7: 'siete', 10: 'sota', 11: 'caballo', 12: 'rey' };
const SUIT_LETTER = { oros: 'O', copas: 'C', espadas: 'E', bastos: 'B' };

const CARDS = [];
for (const suit of SUITS) for (const rank of RANKS) CARDS.push(Object.freeze({ id: rank + SUIT_LETTER[suit], suit, rank }));
const ALL_IDS = CARDS.map(c => c.id);
const BY_ID = {};
for (const c of CARDS) BY_ID[c.id] = c;
const card = id => BY_ID[id];

const isPerro = c => c.suit === 'bastos' && c.rank === 11;
const isPerra = c => c.suit === 'oros' && c.rank === 10;
const isWild = c => isPerro(c) || isPerra(c);

// Puesto en el truque: más alto = mejor
function truqueRank(c) {
  if (isPerro(c)) return 16;
  if (isPerra(c)) return 15;
  if (c.rank === 1 && c.suit === 'espadas') return 14;
  if (c.rank === 1 && c.suit === 'bastos') return 13;
  if (c.rank === 7 && c.suit === 'espadas') return 12;
  if (c.rank === 7 && c.suit === 'oros') return 11;
  return { 3: 10, 2: 9, 1: 8, 12: 7, 11: 6, 10: 5, 7: 4, 6: 3, 5: 2, 4: 1 }[c.rank];
}

// Puntos para el ligado y la flor
function ligadoCardValue(c) {
  if (isPerro(c)) return 29;
  if (isPerra(c)) return 28;
  return c.rank >= 10 ? 0 : c.rank;
}

function cardName(c) {
  if (isPerro(c)) return 'caballo de bastos (perro)';
  if (isPerra(c)) return 'sota de oros (perra)';
  return RANK_NAME[c.rank] + ' de ' + c.suit;
}

// Tres cartas del mismo palo; el perro y la perra sustituyen a cualquiera
function hasFlor(hand) {
  if (hand.length !== 3) return false;
  const wild = hand.filter(isWild).length;
  if (wild >= 2) return true;
  const rest = hand.filter(c => !isWild(c));
  return rest.every(c => c.suit === rest[0].suit);
}

function florValue(hand) {
  return 20 + hand.reduce((s, c) => s + ligadoCardValue(c), 0);
}

// El ligado. Con el perro o la perra: lo suyo (29 o 28) más la carta más alta de las otras, sea del palo que sea
// (perro y siete de oros = 36; si están los dos comodines, el otro cuenta como la figura que es, 0).
// Sin comodín: la mejor pareja del mismo palo, 20 más las dos; sin pareja, la carta más alta.
function ligadoValue(hand) {
  const wilds = hand.filter(isWild);
  if (wilds.length) {
    const top = wilds.reduce((a, c) => (ligadoCardValue(c) > ligadoCardValue(a) ? c : a));
    const rest = hand.filter(c => c !== top).map(c => (isWild(c) ? 0 : ligadoCardValue(c)));
    return ligadoCardValue(top) + Math.max(0, ...rest);
  }
  let best = -1;
  for (let i = 0; i < hand.length; i++) for (let j = i + 1; j < hand.length; j++) {
    const a = hand[i], b = hand[j];
    if (a.suit === b.suit) best = Math.max(best, 20 + ligadoCardValue(a) + ligadoCardValue(b));
  }
  if (best < 0) best = Math.max(...hand.map(ligadoCardValue));
  return best;
}

// Quién gana una baza. plays: [{seat, card}] con objetos carta.
function bazaResult(plays, teamOf) {
  let max = -1;
  for (const p of plays) max = Math.max(max, truqueRank(p.card));
  const tops = plays.filter(p => truqueRank(p.card) === max);
  const teams = new Set(tops.map(p => teamOf(p.seat)));
  if (teams.size > 1) return { result: 'parda', winnerSeat: null };
  return { result: teamOf(tops[0].seat), winnerSeat: tops[0].seat };
}

// Ganador de la jugada a partir de los resultados de las bazas (equipo | 'parda'); null si aún no se sabe
function jugadaWinner(r, manoTeam) {
  if (r.length === 0) return null;
  if (r[0] === 'parda') {
    if (r.length >= 2) return r[1] === 'parda' ? manoTeam : r[1];
    return null;
  }
  if (r.length >= 2) {
    if (r[1] === 'parda' || r[1] === r[0]) return r[0];
    if (r.length >= 3) return r[2] === 'parda' ? r[0] : r[2];
  }
  return null;
}

// Señas que un compañero puede hacer con su mano
function senasFor(hand) {
  const out = [];
  for (const c of hand) {
    if (isPerro(c)) out.push('levanta las cejas (perro)');
    else if (isPerra(c)) out.push('guiña un ojo (perra)');
    else if (c.rank === 1 && c.suit === 'espadas') out.push('saca los labios como para dar un beso (as de espadas)');
    else if (c.rank === 1 && c.suit === 'bastos') out.push('tuerce la boca (as de bastos)');
    else if (c.rank === 7 && c.suit === 'espadas') out.push('levanta el hombro derecho (siete de espadas)');
    else if (c.rank === 7 && c.suit === 'oros') out.push('levanta el hombro izquierdo (siete de oros)');
  }
  const treses = hand.filter(c => c.rank === 3).length;
  if (treses === 1) out.push('inclina la cabeza hacia un lado (un tres)');
  if (treses === 2) out.push('inclina la cabeza hacia un lado y hacia el otro (dos treses)');
  if (treses === 3) out.push('inclina la cabeza a los dos lados y baja la barbilla (tres treses)');
  if (!out.length) out.push('cierra los ojos (va ciego)');
  return out;
}

// ---------------------------------------------------------------- Azar
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------------------------------------------------------------- Partida
class Game {
  constructor(opts = {}) {
    this.mode = opts.mode === '2v2' ? '2v2' : '1v1';
    this.n = this.mode === '2v2' ? 4 : 2;
    this.length = opts.length === 'partida' ? 'partida' : 'juego';
    this.target = opts.target || 40;
    this.rnd = mulberry32(opts.seed != null ? opts.seed : Math.floor(Math.random() * 2147483647));
    const names = opts.names || (this.n === 4 ? ['Tú', 'Fermín', 'Maribel', 'Tío Basilio'] : ['Tú', 'Tío Basilio']);
    const humans = opts.humans || [0];
    this.players = names.map((name, seat) => ({ seat, name, human: humans.includes(seat) }));
    this.humanSeat = humans.length ? humans[0] : null;
    // Los que juegan de carne y hueso (en la mesa con amigos, todos los que no son del ordenador). Es lo mismo en
    // todos los móviles, así que todo lo que dependa de ello sale igual en cada uno
    this.personas = new Set(opts.personas || humans);
    // Modo oculto (los invitados de la mesa con amigos): no se reparte aquí; cada uno solo conoce sus cartas, y
    // lo que no puede saber (flores cantadas al responder, ligados, flores que se enseñan) llega en «pista» con cada jugada
    this.oculto = opts.oculto || null;
    this.pista = {};
    this.nJugada = 0;
    this.vistasReparto = new Set();   // cartas que han quedado a la vista en las jugadas anteriores de este reparto
    this.propias = {};                 // y las que tuvo cada uno (solo las sabe él)
    this.scores = [0, 0];
    this.juegos = [0, 0];
    this.vacas = [0, 0];
    this.juegoNum = 1;
    this.repartoNum = 0;
    this.events = [];
    this.seq = 0;
    this.pending = null;
    this.over = false;
    this.rigged = opts.rigged || null;
    this.dealerFijo = opts.dealer != null ? opts.dealer : null;   // tutorial y pruebas: quién reparte el primero
    this.clock = opts.clock || (() => Date.now()); // pruebas: function(jugadaIdx, participants) -> {seat: [ids]}
  }

  // --- ayudas
  teamOf(seat) { return this.n === 4 ? seat % 2 : seat; }
  next(seat) { return (seat + 1) % this.n; }          // el de la derecha (sentido contrario a las agujas del reloj)
  left(seat) { return (seat + this.n - 1) % this.n; } // el de la izquierda
  partner(seat) { return (seat + 2) % 4; }
  name(seat) { return this.players[seat].name; }
  isHuman(seat) { return this.players[seat].human; }
  humanTeam() { return this.humanSeat == null ? null : this.teamOf(this.humanSeat); }
  teamName(t) {
    if (this.n === 2) return this.name(t);
    const ht = this.humanTeam();
    if (ht == null) return 'Pareja ' + (t + 1);
    return t === ht ? 'Nosotros' : 'Ellos';
  }
  // En un mano a mano del 2 contra 2 habla uno solo: «gana Fermín», «Tú cobras»...
  jugadorDe(t) {
    const J = this.jugada;
    return this.n === 4 && J && J.kind === 'duel' ? J.participants.find(s => this.teamOf(s) === t) : undefined;
  }
  // "Gana X" con concordancia (enJugada: lo que pasa en esta jugada, no en el juego)
  winsText(t, enJugada) {
    const uno = enJugada ? this.jugadorDe(t) : undefined;
    if (uno !== undefined) return this.isHuman(uno) ? 'ganas tú' : 'gana ' + this.name(uno);
    const ht = this.humanTeam();
    if (this.n === 2) return ht === t ? 'ganas tú' : 'gana ' + this.name(t);
    if (ht == null) return 'gana ' + this.teamName(t);
    return t === ht ? 'ganáis vosotros' : 'ganan ellos';
  }
  // Sujeto + verbo concordado para un bando: Tú cobras / Tío Basilio cobra / Nosotros cobramos / Ellos cobran
  teamVerb(t, v3, v2, v1p, v3p, enJugada) {
    const uno = enJugada ? this.jugadorDe(t) : undefined;
    if (uno !== undefined) return this.isHuman(uno) ? 'Tú ' + v2 : this.name(uno) + ' ' + v3;
    if (this.n === 2) return this.isHuman(t) ? 'Tú ' + v2 : this.name(t) + ' ' + v3;
    const ht = this.humanTeam();
    if (ht == null) return this.teamName(t) + ' ' + v3;
    return t === ht ? 'Nosotros ' + v1p : 'Ellos ' + v3p;
  }
  verb(seat, third, second) { return this.isHuman(seat) ? 'Tú ' + second : this.name(seat) + ' ' + third; }
  log(text, extra = {}) { this.events.push(Object.assign({ id: ++this.seq, text, at: this.clock() }, extra)); }
  faltaAmount() { return this.target - Math.max(this.scores[0], this.scores[1]); }
  teamParticipants(team) { return this.jugada.participants.filter(s => this.teamOf(s) === team); }
  florSingers(team) { const J = this.jugada; return J.participants.filter(s => this.teamOf(s) === team && J.florSung[s]); }
  // En modo oculto, las cartas de este jugador no se ven desde este móvil
  esOculta(s) { return !!this.oculto && !this.oculto.ve.includes(s); }
  bazaOrder(leader) {
    const P = this.jugada.participants, i = P.indexOf(leader);
    return P.slice(i).concat(P.slice(0, i));
  }

  // --- inicio
  start() {
    if (this.dealerFijo != null) { this.newReparto(this.dealerFijo); return; }
    // Sorteo: quien tiene la baraja nombra los palos señalando en sentido contrario a las agujas del reloj
    const holder = 0;
    const assign = {};
    SUITS.forEach((s, i) => { assign[s] = (holder + i) % this.n; });
    const cut = this.oculto ? card(this.oculto.corte) : CARDS[Math.floor(this.rnd() * CARDS.length)];
    this.corte = cut.id;
    const dealer = assign[cut.suit];
    this.log(`Sorteo: ${SUITS.map(s => s + ' para ' + this.name(assign[s])).join(', ')}. Al cortar sale el ${cardName(cut)}: reparte ${this.name(dealer)}.`, { kind: 'info' });
    this.newReparto(dealer);
  }

  newReparto(dealer) {
    this.dealer = dealer;
    this.repartoNum++;
    if (this.oculto) this.deck = null;
    else {
      const ids = shuffle(ALL_IDS.slice(), this.rnd);
      const k = 3 + Math.floor(this.rnd() * (ids.length - 5)); // al cortar quedan al menos tres cartas en cada montón
      this.deck = ids.slice(k).concat(ids.slice(0, k));
    }
    this.jugadaIdx = 0;
    this.vistasReparto = new Set();
    this.propias = {};
    this.log(`Reparto ${this.repartoNum}: baraja y reparte ${this.name(dealer)}, corta ${this.name(this.left(dealer))}.`, { kind: 'reparto' });
    this.startJugada();
  }

  jugadaPlan(idx) {
    const d = this.dealer;
    if (this.n === 2) return { kind: 'duel', rival: this.next(d) };
    if (idx === 0) return { kind: 'duel', rival: this.left(d) };
    if (idx === 1) return { kind: 'duel', rival: this.next(d) };
    return { kind: 'team' };
  }

  startJugada() {
    const plan = this.jugadaPlan(this.jugadaIdx);
    const d = this.dealer;
    const participants = plan.kind === 'duel' ? [plan.rival, d] : [1, 2, 3, 4].map(i => (d + i) % 4);
    const hands = {};
    this.nJugada++;
    participants.forEach(s => { hands[s] = []; });
    let datos = null;
    if (this.oculto) {
      // Solo las cartas de este móvil; las de los demás, boca abajo («?»)
      datos = this.oculto.datos(this.nJugada);
      if (!datos) throw new Error('Faltan las cartas de la jugada ' + this.nJugada);
      for (const s of participants) {
        const mias = this.oculto.ve.includes(s) && datos.cartas && datos.cartas.length === 3;
        hands[s] = mias ? datos.cartas.slice() : [0, 1, 2].map(i => `?${s}${i}`);
      }
    } else {
      // Se reparte de una en una empezando por el rival (o por el de la derecha si juega toda la mesa)
      for (let r = 0; r < 3; r++) for (const s of participants) hands[s].push(this.deck.shift());
    }
    if (this.rigged) {
      const fixed = this.rigged(this.jugadaIdx, participants, this);
      if (fixed) for (const s of participants) if (fixed[s]) hands[s] = fixed[s].slice();
    }
    const J = this.jugada = {
      num: this.jugadaIdx + 1, kind: plan.kind, participants, mano: participants[0],
      hands, orig: Object.fromEntries(participants.map(s => [s, hands[s].slice()])),
      firstPlayed: {}, bazas: [{ plays: [] }], b: 0, leader: participants[0], turnSeat: participants[0], emparde: false,
      florSung: {}, florTeams: [false, false], florContest: null, florEnvite: null,
      envido: null, truque: null, negs: [], queue: [], mazo: null,
      ligadoDeclared: false, ended: false, discards: [], tapadas: {}, bazaWinner: null, summary: null,
      firstEvent: this.seq + 1,
    };
    // Cada uno se acuerda de las cartas que ha tenido en este reparto (ya no las puede tener nadie más)
    for (const s of participants) {
      if (this.esOculta(s)) continue;
      const set = this.propias[s] || (this.propias[s] = new Set());
      for (const id of hands[s]) set.add(id);
    }
    if (plan.kind === 'duel') this.log(`Jugada ${J.num} de 3: mano a mano entre ${this.name(J.mano)} y ${this.name(d)}. Es mano ${this.name(J.mano)}.`, { kind: 'jugada' });
    else this.log(`Jugada 3 de 3: juega toda la mesa. Es mano ${this.name(J.mano)}.`, { kind: 'jugada' });
    // Señas: el compañero del ordenador se las hace a quien juega con él (las de carne y hueso, las hace cada uno)
    if (plan.kind === 'team') {
      for (const s of participants) {
        const p = this.partner(s);
        if (this.personas.has(s) || !this.personas.has(p)) continue;
        let senas = null;
        if (!this.oculto) senas = senasFor(J.orig[s].map(card));
        else if (this.oculto.ve.includes(p)) senas = datos.senas || null;
        if (senas) this.log(`${this.name(s)} te hace señas: ${senas.join('; ')}.`, { kind: 'sena', seat: s, private: p, bubble: 'Te hace señas', senas });
      }
    }
    this.advance();
  }

  // --- qué toca ahora
  advance() {
    const J = this.jugada;
    if (J.ended) { this.pending = { type: 'jugadaEnd', summary: J.summary }; return; }
    const c = J.florContest;
    if (c && c.stage === 'decide') {
      const team = c.order[c.idx];
      this.pending = { type: 'florDecide', team, seats: this.florSingers(team) };
      return;
    }
    if (J.negs.length) { this.pending = this.respondPending(); return; }
    if (J.queue.length) {
      const q = J.queue.shift();
      this.openBet(q.kind, q.seat);
      this.advance();
      return;
    }
    this.pending = Object.assign({ type: 'turn', seat: J.turnSeat }, this.legal(J.turnSeat));
  }

  legal(s) {
    const J = this.jugada;
    const mustFlor = !this.esOculta(s) && hasFlor(J.orig[s].map(card)) && !J.florSung[s] && !J.firstPlayed[s];
    const anyFlor = J.florTeams[0] || J.florTeams[1];
    // Truque ya querido: quien lo quiso puede subirlo justo antes de enseñar su última carta,
    // cuando los rivales ya han echado todas las suyas.
    const T = J.truque, team = this.teamOf(s), falta = this.faltaAmount();
    const rivalesSinCartas = this.teamParticipants(1 - team).every(r => !J.hands[r].length);
    const canSubir = !mustFlor && !!T && T.status === 'accepted' && !T.isFalta && T.lastTeam !== team &&
      rivalesSinCartas && J.hands[s].length > 0 && falta - T.amount - 1 >= 1;   // como en el resto del truque: hasta la falta menos 1
    return {
      mustFlor,
      canEnvido: !mustFlor && !J.firstPlayed[s] && !J.envido && !anyFlor,
      canTruque: !mustFlor && !J.truque,
      canSubir, subirMax: canSubir ? falta - T.amount - 1 : 0, subirAmount: T ? T.amount : 0,
      canFaltaSubir: false, faltaAmount: falta,   // la falta solo se echa en el envite
      canMazo: !mustFlor,
      cards: mustFlor ? [] : J.hands[s].slice(),
      emparde: J.emparde,
    };
  }

  respondPending() {
    const J = this.jugada, bet = J.negs[J.negs.length - 1];
    const team = bet.respondingTeam;
    const isFlor = bet.kind === 'florEnvite';
    const seats = isFlor ? this.florSingers(team) : this.teamParticipants(team);
    const falta = this.faltaAmount();
    const maxRaise = falta - bet.amount - 1;
    return {
      type: 'respond', bet: bet.kind, team, seats, callerTeam: bet.lastTeam,
      amount: bet.amount, count: bet.count, isFalta: !!bet.isFalta,
      rejectCost: isFlor ? 4 : (bet.acceptedAmount != null ? bet.acceptedAmount : bet.count), reabierto: bet.acceptedAmount != null,
      canRaise: !isFlor && !bet.isFalta && maxRaise >= 1, maxRaise,
      // La falta solo se echa en el envite (la ronda del ligado, al principio de la jugada); en el truque, no
      canFalta: bet.kind === 'envido' && !bet.isFalta && falta > bet.amount, faltaAmount: falta,
    };
  }

  // --- acciones
  act(a) {
    const p = this.pending;
    if (!p) throw new Error('No hay nada pendiente');
    const J = this.jugada;
    const needTurn = () => {
      if (p.type !== 'turn' || a.seat !== p.seat) throw new Error('No es el turno de ' + a.seat);
    };
    const oculta = a.seat != null && this.esOculta(a.seat);
    switch (a.type) {
      case 'play':
        needTurn();
        if (oculta) this.destapar(a.seat, a.card);
        else if (!p.cards.includes(a.card)) throw new Error('Carta no válida: ' + a.card);
        this.playCard(a.seat, a.card);
        break;
      case 'flor':
        needTurn();
        if (!p.mustFlor && !oculta) throw new Error('No tiene flor que cantar');
        this.singFlor(a.seat, false);
        break;
      case 'envido':
        needTurn();
        if (!p.canEnvido && !oculta) throw new Error('No se puede envidar');
        this.openBet('envido', a.seat);
        break;
      case 'truque':
        needTurn();
        if (!p.canTruque) throw new Error('No se puede trucar');
        this.openBet('truque', a.seat);
        break;
      case 'envidoTruque':
        needTurn();
        if ((!p.canEnvido || !p.canTruque) && !oculta) throw new Error('No se pueden cantar los dos');
        J.queue.push({ kind: 'truque', seat: a.seat });
        this.openBet('envido', a.seat);
        break;
      case 'subir':
        needTurn();
        if (!p.canSubir && !oculta) throw new Error('No se puede subir el truque ahora');
        if (a.falta) throw new Error('La falta solo se echa en el envite');
        this.subirTruque(a.seat, a.amount);
        break;
      case 'mazo':
        needTurn();
        if (!p.canMazo && !oculta) throw new Error('No puede irse al mazo');
        this.goMazo(a.seat);
        break;
      case 'respond':
        if (p.type !== 'respond') throw new Error('No hay apuesta que responder');
        this.respond(a.responses);
        break;
      case 'florDecide':
        if (p.type !== 'florDecide') throw new Error('No hay flores que decidir');
        this.florDecide(a.decisions);
        break;
      case 'continue':
        if (p.type !== 'jugadaEnd') throw new Error('La jugada no ha terminado');
        this.continueAfter();
        return;
      default:
        throw new Error('Acción desconocida: ' + a.type);
    }
    this.advance();
  }

  // Modo oculto: la carta que echa otro sustituye a una de las que estaban boca abajo
  destapar(seat, id) {
    const J = this.jugada, h = J.hands[seat], o = J.orig[seat];
    if (!card(id) || h.includes(id)) return;
    const i = h.findIndex(x => x[0] === '?');
    if (i < 0) throw new Error('No le quedan cartas a ' + seat);
    const tapada = h[i];
    h[i] = id;
    const k = o.indexOf(tapada);
    if (k >= 0) o[k] = id;
  }

  openBet(kind, seat) {
    const J = this.jugada, team = this.teamOf(seat);
    const bet = {
      kind, callerSeat: seat, callerTeam: team, amount: kind === 'envido' ? 2 : 3, count: 1,
      lastTeam: team, respondingTeam: 1 - team, status: 'pending', isFalta: false, history: [],
    };
    J[kind] = bet;
    J.negs.push(bet);
    this.log(`${this.name(seat)}: ¡${kind === 'envido' ? 'Envido' : 'Truque'}! (${bet.amount} chinas)`, { seat, bubble: kind === 'envido' ? '¡Envido!' : '¡Truque!', kind: 'bet', act: kind, betKind: kind, amount: bet.amount });
    // Responder es hablar: quien aún no ha echado carta y tiene flor, la canta antes
    for (const s of this.teamParticipants(1 - team)) {
      if (J.firstPlayed[s] || J.florSung[s]) continue;
      const tiene = this.esOculta(s) ? (this.pista.flores || []).includes(s) : hasFlor(J.orig[s].map(card));
      if (tiene) this.singFlor(s, true);
    }
  }

  subirTruque(seat, n) {
    const J = this.jugada, bet = J.truque, team = this.teamOf(seat);
    bet.acceptedAmount = bet.amount;
    const k = Math.max(1, Math.min(Math.floor(n || 1), Math.max(1, this.faltaAmount() - bet.amount - 1)));
    bet.amount += k;
    this.log(`${this.name(seat)}: Y yo, ${k} más al truque antes de su última carta (${bet.amount} chinas).`, { seat, bubble: `Y yo: ${bet.amount}`, kind: 'bet', act: 'raise', betKind: 'truque', amount: bet.amount, n: k });
    bet.count++;
    bet.lastTeam = team;
    bet.respondingTeam = 1 - team;
    bet.status = 'pending';
    J.negs.push(bet);
  }

  singFlor(s, auto) {
    const J = this.jugada, team = this.teamOf(s);
    J.florSung[s] = true;
    this.log(`${this.name(s)}: ¡Flor!${auto ? ' (la canta antes de responder)' : ''}`, { seat: s, bubble: '¡Flor!', kind: 'flor', act: 'flor', auto: !!auto });
    if (J.envido && !J.envido.annulled) {
      J.envido.annulled = true;
      J.negs = J.negs.filter(b => b !== J.envido);
      this.log('La flor anula el ligado de esta jugada.', { kind: 'info' });
    }
    const had = J.florTeams[team];
    J.florTeams[team] = true;
    if (!had && J.florTeams[1 - team] && !J.florContest) {
      J.florContest = { stage: 'decide', order: [team, 1 - team], idx: 0, result: null };
      this.log('Hay flor en los dos bandos: cada uno puede pasarla o envidarla.', { kind: 'info' });
    }
  }

  // Basta con que uno quiera. Si alguien de carne y hueso dice algo distinto de "no", manda lo suyo (y entre dos
  // personas, lo más fuerte); si no, la respuesta más fuerte del ordenador. Solo depende de quién es persona, que es
  // igual en todos los móviles, así que la mesa con amigos sale igual en cada uno
  combine(responses, seats) {
    const order = { noquiero: 0, pasar: 0, quiero: 1, envidar: 1, raise: 2, falta: 3 };
    const mejor = lista => {
      let best = null;
      for (const s of lista) {
        const r = responses[s];
        if (!r || order[r.kind] == null) continue;
        if (!best || order[r.kind] > order[best.resp.kind] || (r.kind === 'raise' && best.resp.kind === 'raise' && r.amount > best.resp.amount)) best = { seat: s, resp: r };
      }
      return best;
    };
    const personas = seats.filter(s => this.personas.has(s));
    const dePersona = mejor(personas);
    if (dePersona && order[dePersona.resp.kind] > 0) return dePersona;
    const best = mejor(seats);
    if (!best) throw new Error('Falta la respuesta');
    if (dePersona && best.seat !== dePersona.seat && order[best.resp.kind] > 0) {
      const quien = this.isHuman(dePersona.seat) ? 'Tú no quieres' : `${this.name(dePersona.seat)} no quiere`;
      this.log(`${quien}, pero ${this.name(best.seat)} sí: se juega.`, { kind: 'info' });
    }
    return best;
  }

  respond(responses) {
    const J = this.jugada, p = this.pending, bet = J.negs[J.negs.length - 1];
    const { seat, resp } = this.combine(responses, p.seats);
    const team = bet.respondingTeam;
    const label = { envido: 'el envido', truque: 'el truque', florEnvite: 'la flor' }[bet.kind];
    bet.history.push({ seat, kind: resp.kind, amount: resp.amount });
    if (resp.kind === 'quiero') {
      bet.status = 'accepted';
      J.negs.pop();
      this.log(`${this.name(seat)}: Quiero ${label} (${bet.amount} chinas).`, { seat, bubble: 'Quiero', kind: 'bet', act: 'quiero', betKind: bet.kind, amount: bet.amount });
      if (bet.kind === 'florEnvite') {
        J.florContest.stage = 'done';
        J.florContest.result = { accepted: true, callerTeam: bet.callerTeam };
      }
    } else if (resp.kind === 'noquiero') {
      bet.status = 'rejected';
      bet.rejectWinner = bet.lastTeam;
      J.negs.pop();
      const pts = bet.kind === 'florEnvite' ? 4 : bet.acceptedAmount != null ? bet.acceptedAmount : bet.count;
      this.log(`${this.name(seat)}: No quiero ${label}. ${this.teamVerb(bet.lastTeam, 'cobra', 'cobras', 'cobramos', 'cobran', true)} ${pts} ${pts === 1 ? 'china' : 'chinas'}.`, { seat, bubble: 'No quiero', kind: 'bet', act: 'noquiero', betKind: bet.kind, pts, toTeam: bet.lastTeam });
      if (bet.kind === 'florEnvite') {
        J.florContest.stage = 'done';
        J.florContest.result = { accepted: false, winner: bet.lastTeam };
      }
      if (bet.kind === 'truque') this.endJugada('truque');
    } else if (resp.kind === 'raise') {
      if (!p.canRaise) throw new Error('No se puede subir');
      const n = Math.max(1, Math.min(Math.floor(resp.amount || 1), p.maxRaise));
      bet.amount += n;
      bet.count++;
      bet.lastTeam = team;
      bet.respondingTeam = 1 - team;
      this.log(`${this.name(seat)}: Y yo, ${n} más (${bet.amount} chinas).`, { seat, bubble: `Y yo: ${bet.amount}`, kind: 'bet', act: 'raise', betKind: bet.kind, amount: bet.amount, n });
    } else if (resp.kind === 'falta') {
      if (!p.canFalta) throw new Error('No se puede echar la falta');
      bet.amount = p.faltaAmount;
      bet.isFalta = true;
      bet.count++;
      bet.lastTeam = team;
      bet.respondingTeam = 1 - team;
      this.log(`${this.name(seat)}: ¡La falta! (${bet.amount} chinas)`, { seat, bubble: '¡La falta!', kind: 'bet', act: 'falta', betKind: bet.kind, amount: bet.amount });
    } else {
      throw new Error('Respuesta desconocida: ' + resp.kind);
    }
  }

  florDecide(decisions) {
    const J = this.jugada, c = J.florContest, team = c.order[c.idx];
    const { seat, resp } = this.combine(decisions, this.florSingers(team));
    if (resp.kind === 'envidar') {
      this.log(`${this.name(seat)}: Envido la flor.`, { seat, bubble: 'Envido la flor', kind: 'bet', act: 'florEnvidar', betKind: 'florEnvite' });
      const bet = { kind: 'florEnvite', callerSeat: seat, callerTeam: team, amount: 6, count: 1, lastTeam: team, respondingTeam: 1 - team, status: 'pending', history: [] };
      J.florEnvite = bet;
      J.negs.push(bet);
      c.stage = 'responding';
    } else {
      this.log(`${this.name(seat)}: Paso la flor.`, { seat, bubble: 'Paso la flor', kind: 'bet', act: 'florPasar', betKind: 'florEnvite' });

      if (c.idx >= 2) {
        c.stage = 'done';
        c.result = { passed: true };
        this.log('Las dos flores se pasan: nadie cobra la flor.', { kind: 'info' });
      }
    }
  }

  goMazo(seat) {
    const J = this.jugada;
    J.mazo = { seat, team: this.teamOf(seat) };
    this.log(`${this.verb(seat, 'se va', 'te vas')} al mazo.`, { seat, bubble: 'Al mazo', kind: 'bet', act: 'mazo' });
    this.endJugada('mazo');
  }

  playCard(seat, id) {
    const J = this.jugada, hand = J.hands[seat];
    hand.splice(hand.indexOf(id), 1);
    J.bazas[J.b].plays.push({ seat, card: id });
    J.firstPlayed[seat] = true;
    let extra = '';
    if (J.emparde && hand.length) {
      const tapadas = hand.splice(0);
      J.discards.push(...tapadas);
      J.tapadas[seat] = (J.tapadas[seat] || []).concat(tapadas);
      extra = ' y tapa la otra';
    }
    this.log(`${this.verb(seat, 'echa', 'echas')} el ${cardName(card(id))}${extra}.`, { kind: 'play', seat });
    const played = new Set(J.bazas[J.b].plays.map(p => p.seat));
    const nxt = this.bazaOrder(J.leader).find(s => !played.has(s));
    if (nxt === undefined) this.resolveBaza();
    else J.turnSeat = nxt;
  }

  resolveBaza() {
    const J = this.jugada, bz = J.bazas[J.b];
    const r = bazaResult(bz.plays.map(p => ({ seat: p.seat, card: card(p.card) })), s => this.teamOf(s));
    bz.result = r.result;
    bz.winnerSeat = r.winnerSeat;
    const label = J.emparde ? 'El emparde' : `La baza ${J.b + 1}`;
    if (r.result === 'parda') this.log(`${label} queda empatada.`, { kind: 'baza' });
    else {
      const wc = bz.plays.find(p => p.seat === r.winnerSeat).card;
      this.log(`${label} se la lleva ${this.name(r.winnerSeat)} con el ${cardName(card(wc))}.`, { kind: 'baza' });

    for (const x of vals) { const t = this.teamOf(x.seat); best[t] = Math.max(best[t], x.v); }

        } else if (c.result && c.result.accepted === false) {

      if (e.annulled) items.push({ cat: 'ligado', team: null, pts: 0, note: 'Anulado por la flor' });
      else if (e.status === 'accepted') items.push({ cat: 'ligado', team: e.winnerTeam, pts: e.amount, note: `Ligado querido (${e.amount})` });

    for (const it of items) {

      it.applied = true;

    for (const it of items) {

      else if (it.skipped) this.log(`No se cobra (${it.cat}): el juego ya estaba ganado.`, { kind: 'cobro' });
    }

    if (juegoWinner !== null) {
      this.juegos[juegoWinner]++;
      this.log(`${this.teamVerb(juegoWinner, 'llega', 'llegas', 'llegamos', 'llegan')} a ${this.scores[juegoWinner]}: fin del juego.`, { kind: 'juego' });

      else if (this.juegos[juegoWinner] >= 2) {
        vacaWinner = juegoWinner;

        this.log(`${this.teamVerb(vacaWinner, 'gana', 'ganas', 'ganamos', 'ganan')} la vaca.`, { kind: 'juego' });
        if (this.vacas[vacaWinner] >= 2) partidaWinner = vacaWinner;
      }
      if (partidaWinner !== null) this.log(`${this.teamVerb(partidaWinner, 'gana', 'ganas', 'ganamos', 'ganan')} la partida.`, { kind: 'juego' });
    }
    const flores = J.participants.filter(s => J.florSung[s]).map(s => ({ seat: s, cards: J.orig[s].slice(), v: florValue(J.orig[s].map(card)) }));
    // Lo que todos han visto en esta jugada (las cartas echadas y las flores) ya no está en la baraja del reparto
    for (const bz of J.bazas) for (const pl of bz.plays) this.vistasReparto.add(pl.card);
    for (const f of flores) for (const id of f.cards) if (card(id)) this.vistasReparto.add(id);
    J.summary = {
      num: J.num, kind: J.kind, participants: J.participants.slice(), mano: J.mano, reason,
      bazas: J.bazas.map(bz => ({ plays: bz.plays.slice(), result: bz.result, winnerSeat: bz.winnerSeat })).filter(bz => bz.plays.length),
      items, juegoWinner, vacaWinner, partidaWinner,

      envido: e ? { status: e.status, amount: e.amount, count: e.count, annulled: !!e.annulled, values: e.values || null, winnerTeam: e.winnerTeam } : null,
      truque: t ? { status: t.status, amount: t.amount, count: t.count } : null,
      flores, florInfo, mazo: J.mazo, bazaWinner: J.bazaWinner, orig: J.orig,
    };
  }

  // ---------------------------------------------------------------- Para la mesa con amigos (lo usa el anfitrión)
  // Antes de cada jugada se hace una «foto»; después, «pistaDesde» dice lo que los demás no pueden calcular solos
  // porque no ven las cartas: quién cantó flor al responder, los ligados dichos en voz alta, las flores que se
  // enseñan y si empieza otra jugada (para la que cada uno necesita sus cartas en secreto: «privadoPara»).
  foto() {

  }
  pistaDesde(f) {

    if (flores.length) pista.flores = flores;

    const s = this.jugada.summary;

      this.pending = { type: 'partidaEnd', winner: s.partidaWinner };
      return;
    }
    if (s.juegoWinner !== null) {
      this.scores = [0, 0];
      this.juegoNum++;
      if (s.vacaWinner !== null) this.juegos = [0, 0];
      this.log(`Empieza el juego ${this.juegoNum}.`, { kind: 'juego' });
      this.newReparto(this.next(this.dealer));
      return;

    this.jugadaIdx++;
    if (this.jugadaIdx >= 3) this.newReparto(this.next(this.dealer));

<script>
/* El Perro — jugadores controlados por el ordenador.
   Estiman sus probabilidades repartiendo al azar las cartas que no ven y simulando el resto de la jugada. */
(function (root) {
'use strict';
const P = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : root.Perro;
const { card, truqueRank, ligadoValue, florValue, hasFlor, bazaResult, jugadaWinner, ALL_IDS } = P;

const N_PLAY = 80;   // simulaciones por carta candidata
const N_POINTS = 140; // simulaciones para ligado y flor
const rnd = Math.random;

function rotate(list, first) {
  const i = list.indexOf(first);
  return list.slice(i).concat(list.slice(0, i));
}

// Reparte al azar las cartas que este jugador no ve, respetando lo que sabe:
// quien cantó flor la tiene; quien ya echó carta sin cantarla, no. Y como no se baraja entre las tres jugadas
// de un reparto, lo que salió en las anteriores (y lo que tuvo él) ya no puede estar en ninguna mano.
function sampleWorld(game, seat, opts = {}) {
  const J = game.jugada;
  const playedBy = {};
  const seen = new Set(J.orig[seat]);
  for (const id of game.vistasReparto || []) seen.add(id);
  for (const id of (game.propias && game.propias[seat]) || []) seen.add(id);
  for (const bz of J.bazas) for (const p of bz.plays) { seen.add(p.card); (playedBy[p.seat] = playedBy[p.seat] || []).push(p.card); }
  const pool = ALL_IDS.filter(id => !seen.has(id));
  const others = J.participants.filter(s => s !== seat);
  const constrained = J.b === 0;
  const tries = constrained && others.some(o => J.florSung[o]) ? 300 : 30;
  let last = null;
  for (let attempt = 0; attempt < tries; attempt++) {
    let need = 0;
    for (const o of others) need += J.hands[o].length;
    for (let i = 0; i < need; i++) {
      const j = i + Math.floor(rnd() * (pool.length - i));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    let k = 0, ok = true;
    const rem = {}, orig = {};
    for (const o of others) {
      const n = J.hands[o].length;
      rem[o] = pool.slice(k, k + n);
      k += n;
      orig[o] = (playedBy[o] || []).concat(rem[o]);
      if (constrained && orig[o].length === 3) {
        const fl = hasFlor(orig[o].map(card));
        if (J.florSung[o] && !fl) ok = false;
        if (!J.florSung[o] && (J.firstPlayed[o] || opts.noFlor) && fl) ok = false;
      }
    }
    last = { rem, orig };
    if (ok) return last;
  }
  return last;
}

// Jugada sencilla para las simulaciones
function greedy(s, hand, plays, emparde, teamOf) {
  if (!hand.length) return null;
  const sorted = hand.slice().sort((a, b) => truqueRank(a) - truqueRank(b));
  if (emparde || plays.length === 0) return sorted[sorted.length - 1];
  let best = -1;
  for (const p of plays) best = Math.max(best, truqueRank(p.card));
  const tops = plays.filter(p => truqueRank(p.card) === best);
  if (tops.every(p => teamOf(p.seat) === teamOf(s))) return sorted[0];
  const win = sorted.find(c => truqueRank(c) > best);
  return win || sorted[0];
}

// Simula el resto de la jugada y devuelve el equipo que gana las bazas
function simulate(game, hands, forced) {
  const J = game.jugada, teamOf = s => game.teamOf(s), manoTeam = teamOf(J.mano);
  const results = J.bazas.slice(0, J.b).map(b => b.result);
  let plays = J.bazas[J.b].plays.map(p => ({ seat: p.seat, card: card(p.card) }));
  let leader = J.leader, emparde = J.emparde, b = J.b;
  const H = {};
  for (const s of J.participants) H[s] = (hands[s] || []).map(card);
  if (forced) {
    const c = card(forced.card);
    H[forced.seat] = emparde ? [] : H[forced.seat].filter(x => x.id !== c.id);
    plays.push({ seat: forced.seat, card: c });
  }
  for (let guard = 0; guard < 6; guard++) {
    for (const s of rotate(J.participants, leader)) {
      if (plays.some(p => p.seat === s)) continue;
      const c = greedy(s, H[s], plays, emparde, teamOf);
      if (!c) continue;
      H[s] = emparde ? [] : H[s].filter(x => x !== c);
      plays.push({ seat: s, card: c });
    }
    const r = bazaResult(plays, teamOf);
    results.push(r.result);
    const w = jugadaWinner(results, manoTeam);
    if (w !== null) return w;
    b++;
    if (results[0] === 'parda' && b === 1) { emparde = true; leader = J.mano; }
    else { emparde = false; leader = r.winnerSeat; }
    plays = [];
  }
  return manoTeam;
}

function truqueProb(game, seat, forcedCard, n = N_PLAY) {
  const J = game.jugada, my = game.teamOf(seat);
  let wins = 0;
  for (let i = 0; i < n; i++) {
    const w = sampleWorld(game, seat);
    const hands = Object.assign({}, w.rem, { [seat]: J.hands[seat].slice() });
    const res = simulate(game, hands, forcedCard ? { seat, card: forcedCard } : null);
    if (res === my) wins++;
  }
  return wins / n;
}

function ligadoProb(game, seat, n = N_POINTS) {
  const J = game.jugada, my = game.teamOf(seat), mt = game.teamOf(J.mano);
  const mine = ligadoValue(J.orig[seat].map(card));
  let wins = 0;
  for (let i = 0; i < n; i++) {
    const w = sampleWorld(game, seat, { noFlor: true });
    const best = [-1, -1];
    best[my] = mine;
    for (const o in w.orig) {
      const t = game.teamOf(+o);
      best[t] = Math.max(best[t], ligadoValue(w.orig[o].map(card)));
    }
    if (best[my] > best[1 - my] || (best[my] === best[1 - my] && mt === my)) wins++;
  }
  return wins / n;
}

function florProb(game, seat, n = N_POINTS) {
  const J = game.jugada, my = game.teamOf(seat), mt = game.teamOf(J.mano);
  let wins = 0;
  for (let i = 0; i < n; i++) {
    const w = sampleWorld(game, seat);
    const best = [-1, -1];
    for (const s of J.participants) {
      if (!J.florSung[s]) continue;
      const hand = s === seat ? J.orig[seat] : w.orig[s];
      best[game.teamOf(s)] = Math.max(best[game.teamOf(s)], florValue(hand.map(card)));
    }
    if (best[my] > best[1 - my] || (best[my] === best[1 - my] && mt === my)) wins++;
  }
  return wins / n;
}

const pct = x => Math.round(x * 100) + '%';
const debug = (game, seat, text) => game.log(`[IA] ${game.name(seat)}: ${text}`, { kind: 'debug' });

function decideTurn(game, p) {
  const s = p.seat;
  if (p.mustFlor) return { type: 'flor', seat: s };
  const evals = p.cards.map(id => ({ id, p: truqueProb(game, s, id) }));
  evals.sort((a, b) => (b.p - a.p) || (truqueRank(card(a.id)) - truqueRank(card(b.id))));
  // Si dos cartas dan casi lo mismo, guarda la buena

  if (p.canEnvido) {
    const pl = ligadoProb(game, s);
    env = pl > 0.6 || rnd() < 0.06;
    debug(game, s, `ligado ${ligadoValue(game.jugada.orig[s].map(card))}, gana el ligado con ${pct(pl)}${env ? ' → envida' : ''}`);
  }
  if (p.canTruque) {
    tru = pT > 0.72 || rnd() < 0.05;
    debug(game, s, `gana la jugada con ${pct(pT)}${tru ? ' → truca' : ''}`);
  }
  if (p.canSubir) {

    const sube = win > 0.9 || (win < 0.15 && rnd() < 0.12);
    debug(game, s, `última carta, gana con ${pct(win)}${sube ? ' → sube el truque' : ''}`);

function decideResponse(game, p, seat) {
  let prob;
  if (p.bet === 'envido') prob = ligadoProb(game, seat);
  else if (p.bet === 'truque') prob = truqueProb(game, seat, null);
  else prob = florProb(game, seat);

  const prob = florProb(game, seat);

function teamAnswers(game, p, controla = s => !game.isHuman(s)) {
  const out = {};
  for (const s of p.seats) {
    if (!controla(s)) continue;
    out[s] = p.type === 'florDecide' ? decideFlor(game, s) : decideResponse(game, p, s);
  }

}
