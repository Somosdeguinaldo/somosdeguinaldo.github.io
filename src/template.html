<title>El Perro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Una noche en el bar: la partida se ve como desde una cámara en la cabeza. Arriba, la pizarra con el tanteo en tiza;
   abajo, los cantos en posavasos de cartón. Un solo aspecto (oscuro) a propósito: es un bar de noche. */
:root {
  --noche: #120d0a;
  --panel: #2e2219;
  --panel-2: #3d2d21;
  --marfil: #f4eedf;
  --marfil-2: #dcd2bb;
  --papel: #f1ead8;
  --tinta: #221c15;
  --tinta-2: #6b6150;
  --texto: #f0e9d7;
  --texto-2: #b9b2a0;
  --oro: #e4b649;
  --oro-2: #f0cd78;
  --aviso: #e58258;
  --oros: #b07d17;
  --copas: #ad2d27;
  --espadas: #285a8f;
  --bastos: #3a6f33;
  --dorso: #7c2a24;
  --dorso-2: #66221d;
  --pizarra: #232c27;
  --tiza: #efebe1;
  --tiza-2: #b9b6ab;
  --tiza-nos: #f2d27a;
  --tiza-ellos: #a9cfe8;
  --marco: #5e3b1f;
  --f-display: "Alegreya SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-tiza: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --tilt: 11deg;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, #2a1d14, var(--noche) 70%) var(--noche);
  color: var(--texto);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* ---------- Naipes: la baraja española dibujada en naipes.js (símbolos SVG); aquí solo el cartón */
.card {
  --w: 74px;
  width: var(--w); height: calc(var(--w) * 1.48); flex: none;
  position: relative; display: inline-block; overflow: hidden;
  border-radius: calc(var(--w) * .075); border: 0; padding: 0; margin: 0;
  background: #fdfcf8; font: inherit; color: inherit; vertical-align: middle;
  box-shadow: 0 0 0 1px rgba(70,50,30,.38), 0 1px 0 rgba(0,0,0,.3), 0 5px 12px rgba(0,0,0,.28);
  user-select: none; -webkit-user-select: none;
}
button.card { appearance: none; -webkit-appearance: none; }
.card > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.card .dorso, .card.back .cara { display: none; }
.card.back .dorso { display: block; }
.card.sm { --w: 34px; }

/* ---------- Botones generales (menú y hojas) */
.btn {
  min-height: 44px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--oro);
  background: transparent; color: var(--texto); font-weight: 700; font-size: 15px; cursor: pointer; line-height: 1.15;
}
.btn:hover { background: rgba(228,182,73,.12); }
.btn.primary { background: var(--oro); color: var(--tinta); }
.btn.primary:hover { background: var(--oro-2); }
.btn:focus-visible { outline: 3px solid var(--oro-2); outline-offset: 2px; }
.btn small { display: block; font-weight: 500; font-size: 12.5px; opacity: .8; margin-top: 2px; }

/* ---------- La puerta del bar (menú de inicio) */
.screen { height: 100%; }
.bar-entrada { position: relative; height: 100%; }
.fachada-wrap { position: absolute; top: 0; bottom: 0; left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); overflow: hidden; background: #2a1d14; }
.fachada-wrap svg { display: block; width: 100%; height: 100%; transform-origin: var(--px, 50%) var(--py, 50%); transition: transform .8s cubic-bezier(.55,0,.8,.2); }
.fachada-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 42%, transparent 55%, rgba(6,4,2,.6) 100%); }
.bar-entrada::after { content: ''; position: absolute; inset: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); pointer-events: none; opacity: 0; transition: opacity .55s .3s ease-in;
  background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), #ffe0a0, #c27b36 35%, #120d0a 75%); }
.bar-entrada.entrando .fachada-wrap svg { transform: scale(2.6); }
.bar-entrada.entrando::after { opacity: 1; }
.bar-entrada.entrando .menu-capa { opacity: 0; transform: translateY(14px) scale(.97); }
.menu-capa { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; transition: opacity .3s, transform .3s;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.menu-col { width: min(100%, 410px); padding-top: var(--tope, 110px); display: grid; gap: 4px; }

/* El papel de «Se buscan jugadores», pegado con celo en la esquina de la pizarra: la mesa con amigos */
.nota-mesa {
  position: absolute; z-index: 3; left: -12px; top: -16px; width: 94px; padding: 10px 6px 0; border: 0; cursor: pointer;
  color: #2a241d; transform: rotate(-8deg); transform-origin: 60% 0; transition: transform .2s ease;
  background: #fbf6e9 linear-gradient(rgba(60,90,140,.09) 1px, transparent 1px) 0 6px / 100% 9px;
  box-shadow: 1px 2px 0 rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.45);
  font-family: var(--f-display); text-align: center; line-height: 1;
}
.nota-mesa::before { content: ''; position: absolute; top: -8px; left: 50%; width: 42px; height: 15px; margin-left: -21px; background: rgba(240,222,160,.82); transform: rotate(4deg); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.nota-mesa b { display: block; font-size: 14.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; color: #a8281f; }
.nota-mesa small { display: block; margin-top: 4px; font: 700 10.5px/1.15 var(--f-body); color: #3d3226; }
.nota-mesa .tiras { display: flex; margin: 6px -6px 0; border-top: 1.5px dashed #c9b892; }
.nota-mesa .tiras i { flex: 1; height: 32px; border-right: 1px dashed #c9b892; font: 800 7.5px/1 var(--f-body); writing-mode: vertical-rl; color: #6b5b45; font-style: normal; padding-top: 3px; overflow: hidden; }
.nota-mesa .tiras i:last-child { border-right: 0; }
.nota-mesa .tiras i.arrancada { visibility: hidden; }
.nota-mesa:hover { transform: rotate(-5deg) translateY(-2px); }
.nota-mesa:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }

/* La mesa del fondo: la hoja para jugar con amigos */
.mesa-intro { color: var(--tinta-2); margin-top: -4px; }
.campo { display: grid; gap: 5px; font-weight: 700; }
.campo input, .codigo-input { width: 100%; box-sizing: border-box; font: 600 17px var(--f-body); padding: 10px 12px; border: 1.5px solid #cfc4ad; border-radius: 10px; background: #fffaf0; color: var(--tinta); }
.campo input:focus, .codigo-input:focus { outline: 3px solid rgba(217,169,58,.6); outline-offset: 1px; }
.mesa-dos { display: grid; gap: 10px; margin-top: 12px; }
@media (min-width: 560px) { .mesa-dos { grid-template-columns: 1fr 1fr; } }
.mesa-op { display: grid; gap: 7px; align-content: start; padding: 12px; border-radius: 12px; background: rgba(107,68,35,.06); border: 1.5px dashed #cfc4ad; }
.mesa-op b { font-family: var(--f-display); font-size: 17px; }
.mesa-op span { font-size: 14px; color: var(--tinta-2); }
.mesa-op.destacada { border-style: solid; border-color: #d9a93a; background: rgba(242,210,122,.18); }
.codigo-input { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; }
.enlace-ayuda { display: inline-block; margin-top: 12px; padding: 4px 0; border: 0; background: none; color: #6b4423; font: 700 15px var(--f-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.enlace-ayuda:hover { color: #a8281f; }
.codigo-mesa { display: inline-block; padding: 1px 10px 2px; border-radius: 8px; background: var(--pizarra); color: #fffaf0; letter-spacing: .14em; font-family: var(--f-display); }
.mesa-invitar { display: flex; flex-wrap: wrap; gap: 8px; }
.sillas { position: relative; width: 100%; height: 236px; margin: 14px auto 4px; max-width: 340px; }
.sillas-2 { height: 206px; }
.mesita-sala { position: absolute; left: 50%; top: 50%; width: 118px; height: 80px; margin: -40px 0 0 -59px; border-radius: 8px; background: #2f5c3e; border: 6px solid #6b4423; box-shadow: inset 0 0 14px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.25); }
.mesita-sala span { position: absolute; font: 800 9.5px var(--f-body); text-transform: uppercase; letter-spacing: .06em; }
.mesita-sala .pa { left: 5px; top: 5px; color: #f2d27a; }
.mesita-sala .pb { right: 5px; bottom: 5px; color: #a9c7e8; }
.silla { position: absolute; min-width: 84px; max-width: 112px; padding: 6px 10px; border-radius: 12px; border: 2px solid #cfc4ad; background: #fffaf0; color: var(--tinta); display: grid; justify-items: center; gap: 1px; font-family: var(--f-body); box-shadow: 0 2px 4px rgba(0,0,0,.15); transition: transform .15s ease; }
.silla:disabled { cursor: default; opacity: 1; }
.silla:not(:disabled) { cursor: pointer; }
.silla b { font-size: 15px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.silla small { font-size: 11px; color: var(--tinta-2); }
.silla.libre { border-style: dashed; background: rgba(255,250,240,.6); }
.silla.libre b { color: var(--tinta-2); font-weight: 600; }
.silla.mia { box-shadow: 0 0 0 3px rgba(217,169,58,.6), 0 2px 4px rgba(0,0,0,.15); }
.silla.pareja-a { border-color: #d9a93a; }
.silla.pareja-b { border-color: #6f97c4; }
.silla.sel { border-color: #a8281f; transform: scale(1.06); }
.silla.abajo { left: 50%; bottom: 0; translate: -50% 0; }
.silla.arriba { left: 50%; top: 0; translate: -50% 0; }
.silla.izquierda { left: 0; top: 50%; translate: 0 -50%; }
.silla.derecha { right: 0; top: 50%; translate: 0 -50%; }
.mesa-ajustes { display: grid; gap: 8px; justify-items: center; margin: 10px 0 4px; }
.mesa-modo-txt { text-align: center; color: var(--tinta-2); font-weight: 700; }
.btn.grande { display: block; width: 100%; font-size: 19px; padding: 13px; margin-top: 8px; }
.nota-sala, .de-pie { font-size: 13.5px; color: var(--tinta-2); text-align: center; margin: 6px 0; }
.espera-red { text-align: center; font-weight: 700; color: #6b4423; margin: 8px 0; }
.pasos-mesa { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 12px; }
.paso-mesa { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: center; }
.paso-mesa .dibu svg { width: 108px; height: 76px; display: block; border-radius: 10px; background: #e9dfca; }
.paso-mesa b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 2px; }
.paso-mesa b i { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: var(--tinta); color: #fbf3e2; font: 800 13px var(--f-body); vertical-align: 1px; }
.paso-mesa span { font-size: 14px; color: var(--tinta-2); line-height: 1.35; }
.tag.fuera-red { background: #5c4a35; color: #f4ecd8; }

/* El caballete con la pizarra */
.caballete { position: relative; padding-bottom: 40px; margin: 0; }
.caballete::before, .caballete::after { content: ''; position: absolute; top: 18px; bottom: 0; width: 15px; border-radius: 4px; z-index: 0; transform-origin: 50% 0;
  background: linear-gradient(90deg, #3e2614, #7a5030 45%, #4a2f19); box-shadow: 0 8px 12px rgba(0,0,0,.45); }
.caballete::before { left: 13%; transform: rotate(7deg); }
.caballete::after { right: 13%; transform: rotate(-7deg); }
.pizarra-menu {
  position: relative; z-index: 1; text-align: center;
  padding: 12px 16px 16px; border-radius: 10px; border: 9px solid #6b4423;
  background:
    radial-gradient(45% 35% at 25% 20%, rgba(255,255,255,.06), transparent 70%),
    radial-gradient(40% 30% at 80% 75%, rgba(255,255,255,.05), transparent 70%),
    radial-gradient(30% 20% at 60% 40%, rgba(255,255,255,.035), transparent 70%),
    var(--pizarra);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.4), inset 0 0 26px rgba(0,0,0,.6), 0 0 0 2px #4a2d16, 0 18px 30px rgba(0,0,0,.55);
  color: var(--tiza); font-family: var(--f-tiza);
}
.pizarra-menu::after { content: ''; position: absolute; left: -12px; right: -12px; bottom: -20px; height: 12px; border-radius: 3px; background: linear-gradient(#7a5030, #4a2f19); box-shadow: 0 4px 8px rgba(0,0,0,.5); }
.pizarra-menu::before { content: ''; position: absolute; left: 22%; bottom: -15px; width: 34px; height: 6px; border-radius: 3px; background: #f1ede2; box-shadow: 44px 1px 0 -1px #f2d27a; }
.hoy { margin: 0; font-size: 21px; line-height: 1; color: var(--tiza-2); }
.titulo-tiza { margin: 0; font-family: var(--f-tiza); font-weight: 700; font-size: clamp(50px, 15vw, 62px); line-height: .92; color: #fffaf0; text-shadow: 0 0 2px rgba(255,255,255,.45); display: flex; align-items: center; justify-content: center; gap: 10px; }
.titulo-tiza svg { width: 26px; height: 26px; opacity: .85; }
.titulo-tiza .izq { color: #9fc7e8; transform: rotate(-12deg); } .titulo-tiza .der { color: #f0a29a; transform: rotate(10deg); }
.sub-tiza { margin: 2px 0 0; font-size: 17px; line-height: 1.1; color: var(--tiza-2); }
.raya-tiza { height: 2px; margin: 10px 8px 8px; background: repeating-linear-gradient(90deg, rgba(239,235,225,.45) 0 14px, transparent 14px 20px); border-radius: 2px; }
.tiza-grupo { border: 0; margin: 0 0 8px; padding: 0; min-width: 0; }
.tiza-grupo legend { padding: 0; margin: 0 auto 4px; font-size: 22px; line-height: 1.1; color: var(--tiza-nos); }
.tiza-grupo legend i { font-style: normal; display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 6px; border: 2px solid currentColor; border-radius: 50% 46% 52% 48%; font-size: 18px; }
.oculto { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.modos-tiza { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opcion-tiza { position: relative; display: grid; justify-items: center; gap: 1px; padding: 6px 6px 9px; border-radius: 12px; cursor: pointer; color: var(--tiza-2); transition: color .15s; }
.opcion-tiza:hover { color: var(--tiza); }
.opcion-tiza .mesa-tiza { width: 78px; height: 52px; overflow: visible; }
.opcion-tiza b { font-size: 26px; line-height: 1; color: var(--tiza); font-weight: 700; }
.opcion-tiza small { font-size: 16.5px; line-height: 1.05; }
/* El círculo de tiza alrededor de lo elegido */
.opcion-tiza::before, .opcion-tiza::after { content: ''; position: absolute; pointer-events: none; opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
.opcion-tiza::before { inset: 0; border: 2.6px solid var(--tiza-nos); border-radius: 18px 26px 15px 28px / 26px 15px 28px 18px; transform: scale(.9) rotate(-2deg); box-shadow: 0 0 5px rgba(242,210,122,.35); }
.opcion-tiza::after { inset: 3px -3px -2px 4px; border: 1.4px solid rgba(242,210,122,.55); border-radius: 26px 16px 28px 15px / 15px 28px 18px 26px; transform: scale(.9) rotate(1deg); }
.duracion-tiza .opcion-tiza::before { border-radius: 50% 46% 52% 48% / 52% 50% 48% 50%; }
.duracion-tiza .opcion-tiza::after { border-radius: 48% 52% 46% 50% / 50% 46% 52% 48%; }
input:checked + .opcion-tiza { color: var(--tiza); }
input:checked + .opcion-tiza b { color: var(--tiza-nos); }
input:checked + .opcion-tiza::before { opacity: 1; transform: rotate(-1.2deg); }
input:checked + .opcion-tiza::after { opacity: 1; transform: rotate(.8deg); }
input:focus-visible + .opcion-tiza { outline: 2px dashed var(--tiza); outline-offset: 3px; }
.duracion-tiza { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; }
.duracion-tiza .opcion-tiza { padding: 5px 12px 7px; }
.duracion-tiza .opcion-tiza b { font-size: 21px; }
.duracion-tiza .opcion-tiza small { font-size: 15.5px; }
.entrar-tiza {
  position: relative; width: 100%; margin-top: 6px; padding: 8px 14px 10px; border: 0; cursor: pointer;
  font-family: var(--f-tiza); font-weight: 700; font-size: 33px; line-height: 1; color: #2b1d0c;
  border-radius: 14px 18px 12px 20px;
  background: repeating-linear-gradient(-58deg, rgba(255,255,255,.18) 0 3px, transparent 3px 7px), #f2cf6e;
  box-shadow: 0 0 0 2px rgba(242,207,110,.35), 0 0 18px rgba(242,207,110,.35);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  animation: llama 2.4s ease-in-out infinite;
}
.entrar-tiza svg { width: 34px; height: 24px; }
.entrar-tiza small { display: block; font-size: 17px; font-weight: 500; opacity: .8; }
.entrar-tiza:hover { filter: brightness(1.06); }
.entrar-tiza:active { transform: translateY(1px) scale(.99); }
.entrar-tiza:focus-visible { outline: 3px dashed var(--tiza); outline-offset: 4px; }
@keyframes llama { 0%, 100% { box-shadow: 0 0 0 2px rgba(242,207,110,.35), 0 0 14px rgba(242,207,110,.3); } 50% { box-shadow: 0 0 0 2px rgba(242,207,110,.5), 0 0 26px rgba(242,207,110,.55); } }

/* En horizontal, la pizarra a la izquierda (delante de las ventanas) y la puerta a la vista */
.bar-entrada.horizontal .menu-capa { align-items: flex-start; justify-content: center; padding-left: clamp(24px, 6vw, 110px); }
.bar-entrada.horizontal .menu-col { padding-top: 0; }

/* La mesa de la terraza con los posavasos */
.mesita { position: relative; display: flex; justify-content: center; gap: 26px; padding: 10px 0 16px; }
.mesita::before { content: ''; position: absolute; left: 7%; right: 7%; top: 30px; bottom: 6px; z-index: 0; border-radius: 12px;
  background: linear-gradient(#f5f3ee, #d9d5cb); box-shadow: 0 6px 0 #c3beb3, 0 18px 26px rgba(0,0,0,.55);
  transform: perspective(520px) rotateX(42deg); transform-origin: 50% 100%; }
.mesita .pv { z-index: 1; }
.pv.pv-menu { width: 104px; height: 104px; font-size: 13px; gap: 3px; box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 5.5px var(--t), inset 0 0 0 7px var(--c), 0 3px 0 rgba(0,0,0,.3), 0 12px 18px rgba(0,0,0,.5); }
.pv-menu svg { width: 38px; height: 30px; overflow: visible; }
.pv-cartas { --c: #efe5cf; --t: #a8281f; }
.pv-ajustes { --c: #efe5cf; --t: #24508a; }

@media (max-width: 520px) {
  .menu-col { width: min(100%, 380px); }
  .pizarra-menu { padding: 8px 12px 12px; border-width: 8px; }
  .hoy { font-size: 18px; }
  .titulo-tiza { font-size: 46px; }
  .titulo-tiza svg { width: 22px; height: 22px; }
  .sub-tiza { font-size: 14.5px; }
  .raya-tiza { margin: 7px 8px 6px; }
  .tiza-grupo { margin-bottom: 6px; }
  .tiza-grupo legend { font-size: 19.5px; }
  .tiza-grupo legend i { width: 23px; height: 23px; font-size: 16px; }
  .opcion-tiza { padding: 4px 4px 7px; }
  .opcion-tiza .mesa-tiza { width: 62px; height: 40px; }
  .opcion-tiza b { font-size: 22px; }
  .opcion-tiza small { font-size: 14.5px; }
  .duracion-tiza .opcion-tiza b { font-size: 19px; }
  .duracion-tiza .opcion-tiza small { font-size: 14px; }
  .entrar-tiza { font-size: 28px; padding: 6px 12px 8px; }
  .caballete { padding-bottom: 30px; }
  .mesita { gap: 22px; padding: 4px 0 8px; }
  .mesita::before { top: 24px; }
  .pv.pv-menu { width: 86px; height: 86px; font-size: 11.5px; }
  .pv-menu svg { width: 32px; height: 26px; }
}
@media (max-height: 700px) and (max-width: 520px) {
  .titulo-tiza { font-size: 40px; }
  .opcion-tiza .mesa-tiza { width: 52px; height: 34px; }
  .sub-tiza { font-size: 13.5px; }
}

/* ---------- Tutorial: las notas de Tío Basilio */
.pv-aprender { --c: #efe5cf; --t: #2f6b3a; }
.tuto { position: fixed; left: 0; right: 0; z-index: 40; display: flex; justify-content: center; pointer-events: none;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); }
.tuto.arriba { top: 0; }
.tuto.abajo { bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.tuto.bienvenida { inset: 0; align-items: center; background: rgba(10,6,4,.5); pointer-events: auto; overflow-y: auto; }
.tuto-nota {
  pointer-events: auto; position: relative; width: min(100%, 560px);
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 12px 14px 12px 12px; margin-top: 8px;
  background: radial-gradient(120% 90% at 20% 0%, #fbf6ea, var(--papel) 60%, #e9dfc8); color: var(--tinta);
  border-radius: 5px 9px 7px 11px; box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(60,40,20,.15);
  transform: rotate(-.7deg); animation: nota-entra .32s cubic-bezier(.2,.9,.3,1.2);
}
.tuto-nota::before { content: ''; position: absolute; top: -10px; left: 50%; width: 84px; height: 20px; transform: translateX(-50%) rotate(2.5deg);
  background: rgba(236,222,170,.78); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
@keyframes nota-entra { from { opacity: 0; transform: translateY(-10px) rotate(-2deg) scale(.97); } to { opacity: 1; transform: rotate(-.7deg); } }
.tuto.abajo .tuto-nota { animation-name: nota-sube; }
@keyframes nota-sube { from { opacity: 0; transform: translateY(10px) rotate(1deg) scale(.97); } to { opacity: 1; transform: rotate(-.7deg); } }
.tuto-cara svg { display: block; width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 0 0 2px #fff8ea, 0 0 0 3.5px rgba(60,40,20,.35); }
.tuto-cuerpo { min-width: 0; padding-right: 34px; }
.tuto-cab { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.tuto-cab b { font-family: var(--f-display); font-size: 16px; }
.tuto-paso { font-size: 12px; color: var(--tinta-2); font-weight: 700; }
.tuto-texto { font-size: 15px; line-height: 1.38; }
.tuto-texto p { margin: 0 0 6px; }
.tuto-texto p:last-child { margin-bottom: 0; }
.tuto-texto .haz { font-style: normal; font-weight: 800; color: #8a2a1c; }
.tuto-mini { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.tuto-mini { gap: 3px; flex-wrap: nowrap; }
.tuto-mini .card { --w: min(30px, 8.6vw); }
.tuto-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.tuto-acts .btn { min-height: 40px; padding: 7px 14px; color: var(--tinta); border-color: var(--tinta); background: transparent; }
.tuto-acts .btn.primary { background: var(--tinta); color: var(--papel); }
.pv.pv-saltar { --c: #b9ad99; --t: #3a3229; position: absolute; top: -16px; right: -10px; width: 58px; height: 58px; font-size: 9.5px; line-height: 1; }
.tuto-nota.grande { width: min(100%, 470px); grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 20px 18px 18px; }
.tuto-nota.grande .tuto-cara svg { width: 96px; height: 96px; }
.tuto-nota.grande .tuto-cuerpo { padding-right: 0; }
.tuto-nota.grande h2 { font-size: 26px; margin: 2px 0 8px; }
.tuto-nota.grande .tuto-texto { font-size: 16px; }
.bienvenida-acts { justify-content: center; align-items: center; gap: 18px; margin-top: 14px; }
.bienvenida-acts .entrar-tiza { width: auto; flex: 1; min-width: 180px; margin: 0; }
.pv.pv-saltar.grande { position: relative; top: auto; right: auto; width: 88px; height: 88px; font-size: 11px; flex: none; }
.pv-saltar small { font-family: var(--f-body); text-transform: none; font-weight: 800; font-size: 10.5px; }
/* Lo que se está enseñando, con un brillo; lo que no toca, apagado */
.tuto-foco { outline: 3px solid var(--oro-2) !important; outline-offset: 3px; animation: foco 1.1s ease-in-out infinite; border-radius: 8px; }
@keyframes foco { 0%, 100% { outline-color: rgba(240,205,120,.95); } 50% { outline-color: rgba(240,205,120,.3); } }
.pv.apagado { opacity: .32; filter: saturate(.3); cursor: not-allowed; }
.pv.apagado:hover { transform: rotate(var(--r)); }
body.en-tutorial #sheet [data-continue] { display: none; }
@media (max-width: 520px) {
  .tuto-nota { grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 10px 10px 10px 10px; }
  .tuto-cara svg { width: 44px; height: 44px; }
  .tuto-texto { font-size: 14px; line-height: 1.33; }
  .tuto-cuerpo { padding-right: 30px; }
  .pv.pv-saltar { width: 52px; height: 52px; font-size: 8.5px; top: -14px; right: -6px; }
  .tuto-acts .btn { min-height: 38px; padding: 6px 12px; font-size: 14px; }
}

/* La cuenta */
.pv-cuenta { --c: #efe5cf; --t: #7a4a14; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1.5px solid #d6ccb4; border-radius: 10px; padding: 8px 6px; text-align: center; background: rgba(255,255,255,.35); }
.stats b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12.5px; color: var(--tinta-2); line-height: 1.15; display: block; }
.nota-hoja { font-size: 13.5px; color: var(--tinta-2); }
.msg-hoja { padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 14.5px; }
.msg-hoja.bien { background: #dfe9d3; color: #2c4a1e; } .msg-hoja.mal { background: #f3d6cf; color: #7a2216; }
.pestanas { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--tinta); border-radius: 10px; overflow: hidden; }
.pestana { border: 0; background: transparent; padding: 9px 8px; font-weight: 800; cursor: pointer; color: var(--tinta); }
.pestana.activa { background: var(--tinta); color: var(--papel); }
.pestana:focus-visible { outline: 3px solid var(--oro); outline-offset: -3px; }
.form-hoja { display: grid; gap: 10px; }
.form-hoja label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.form-hoja label small { font-weight: 500; color: var(--tinta-2); font-size: 12.5px; }
.form-hoja input { font: inherit; font-weight: 500; font-size: 16px; padding: 10px 12px; border-radius: 9px; border: 1.5px solid #bfb39a; background: #fffdf7; color: var(--tinta); }
.form-hoja input:focus { outline: 3px solid rgba(228,182,73,.55); border-color: var(--tinta); }
.form-hoja.en-linea { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.form-hoja .btn { justify-self: stretch; }
.enlace-hoja { background: none; border: 0; padding: 4px 0; color: #6b4423; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: center; }
@media (max-width: 520px) {
  .mesita { gap: 12px; }
  .pv.pv-menu { width: 76px; height: 76px; font-size: 10.5px; }
  .pv-menu svg { width: 28px; height: 22px; }
}

/* Ajustes y otras hojas: opciones */
.opt-label { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--tinta-2); margin-bottom: 6px; display: block; }
.ajustes { display: grid; gap: 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #cfc4ad; cursor: pointer; font-weight: 700; }
.seg input:checked + span { border-color: var(--tinta); background: rgba(34,28,21,.08); }
.seg input:focus-visible + span { outline: 3px solid var(--oro); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: #6b4423; flex: none; }
.checks { display: grid; gap: 8px; }

/* ---------- Partida */
.juego { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px)); max-width: 1280px; margin: 0 auto; }

/* La pizarra del bar: solo el tanteo, en una fila (número grande y barra hasta 40) */
.pizarra {
  position: relative; z-index: 15;
  display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto; align-items: center; column-gap: 10px;
  padding: 4px 7px 5px; border-radius: 8px; border: 4px solid var(--marco);
  background:
    radial-gradient(40% 60% at 22% 30%, rgba(255,255,255,.05), transparent 70%),
    radial-gradient(30% 50% at 78% 70%, rgba(255,255,255,.04), transparent 70%),
    var(--pizarra);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.45), inset 0 0 22px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.45);
  color: var(--tiza); font-family: var(--f-body);
}
.pz-btn {
  display: grid; justify-items: center; gap: 1px; min-width: 48px; min-height: 44px; padding: 4px 5px 3px;
  background: rgba(255,255,255,.04); border: 1.5px solid rgba(239,235,225,.3); border-radius: 9px;
  color: var(--tiza); font: 700 11.5px/1 var(--f-body); letter-spacing: .02em; cursor: pointer;
}
.pz-btn svg { width: 19px; height: 19px; }
.pz-btn:hover { background: rgba(255,255,255,.09); border-color: rgba(239,235,225,.55); }
.pz-btn:focus-visible { outline: 2px dashed var(--tiza); outline-offset: 2px; }
.pz-btn[aria-expanded="true"] { background: rgba(242,210,122,.16); border-color: var(--tiza-nos); }
.equipo { position: relative; display: grid; grid-template-columns: auto minmax(30px, 1fr); grid-template-rows: auto auto; align-items: center; column-gap: 8px; row-gap: 0; min-width: 0; color: var(--tc); }
.equipo.nos { --tc: var(--tiza-nos); } .equipo.ellos { --tc: var(--tiza-ellos); }
.equipo .nombre { grid-column: 1 / -1; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.equipo .tanteo { display: flex; align-items: baseline; gap: 4px; line-height: 1; }
.equipo .num { font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fffaf0; text-shadow: 0 0 10px color-mix(in srgb, var(--tc) 45%, transparent); }
.equipo .tanteo small { font-size: 12px; font-weight: 700; color: var(--tiza-2); white-space: nowrap; }
.equipo .detalle { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 4px; row-gap: 2px; min-width: 0; }
.equipo .meta { font-size: 11.5px; font-weight: 800; line-height: 1; color: var(--tiza-2); font-variant-numeric: tabular-nums; }
.equipo .barra { position: relative; display: block; height: 7px; border-radius: 4px; background: rgba(239,235,225,.14); overflow: hidden; }
.equipo .barra i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--tc); transition: width .8s cubic-bezier(.3,1.2,.5,1); }
.equipo .barra::after { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: rgba(18,24,21,.9); }
.equipo .malas { grid-column: 1 / -1; font-size: 11.5px; font-weight: 600; line-height: 1; color: var(--tiza-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.equipo .juegos { grid-column: 1 / -1; font-size: 11px; font-weight: 600; line-height: 1.15; color: var(--tiza-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.equipo .mas { position: absolute; left: 0; top: 0; font-style: normal; font-size: 18px; font-weight: 800; color: var(--tc); pointer-events: none; animation: mas 1.8s ease-out forwards; }
.equipo.sube .num { animation: late .9s ease-out; display: inline-block; }
@keyframes mas { 0% { opacity: 0; transform: translate(30px, 26px) scale(.7); } 15% { opacity: 1; transform: translate(30px, 14px) scale(1.15); } 70% { opacity: 1; transform: translate(30px, 4px) scale(1); } 100% { opacity: 0; transform: translate(30px, -6px); } }
@keyframes late { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* Lo apostado en la jugada, en la esquina de la cámara */
.apuestas { position: absolute; top: 8px; right: 8px; z-index: 6; display: grid; justify-items: end; gap: 4px; pointer-events: none; max-width: 58%; }
.chip-pz { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; border: 1.5px solid rgba(239,235,225,.55); background: rgba(24,31,27,.86); box-shadow: 0 2px 6px rgba(0,0,0,.4); font: 700 12.5px/1.25 var(--f-body); color: var(--tiza); white-space: nowrap; }
.chip-pz.viva { border-color: var(--tiza-nos); color: #2a1f10; background: var(--tiza-nos); }
.chip-pz.apagada { border-style: dashed; color: var(--tiza-2); border-color: rgba(239,235,225,.3); background: rgba(24,31,27,.7); }

/* Registro desplegable */
.registro {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: min(390px, calc(100vw - 32px)); max-height: min(58vh, 460px);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--panel-2); border-radius: 12px;
  box-shadow: 0 16px 40px rgba(0,0,0,.55); font-family: var(--f-body); color: var(--texto);
}
.registro-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--panel-2); }
.registro-head b { font-family: var(--f-display); font-size: 16px; }
.registro-head span { color: var(--texto-2); font-size: 12.5px; flex: 1; }
.registro-head button { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; color: var(--texto-2); }
.registro-head button:hover { background: var(--panel-2); color: var(--texto); }
.log-list { list-style: none; margin: 0; padding: 6px 12px 10px; overflow-y: auto; display: grid; gap: 1px; font-size: 13px; }
.log-list li { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; padding: 3px 0; }
.log-list time { color: var(--texto-2); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.log-list .k-jugada, .log-list .k-reparto { color: var(--oro-2); font-weight: 800; border-top: 1px solid var(--panel-2); padding-top: 6px; margin-top: 4px; }
.log-list .k-cobro { color: var(--oro-2); }
.log-list .k-juego { font-weight: 800; color: var(--oro); }
.log-list .k-baza, .log-list .k-ligado, .log-list .k-bet, .log-list .k-flor { color: var(--texto); font-weight: 700; }
.log-list .k-play, .log-list .k-info { color: var(--texto-2); }
.log-list .k-sena { color: var(--oro-2); font-style: italic; }
.log-list .k-debug { color: #93a99c; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }

/* La cámara en la cabeza */
.camara { position: relative; overflow: hidden; overflow: clip; min-height: 0; border-radius: 18px; background: #2a231d; box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.5); }
.temblor { position: absolute; inset: 0; perspective: 1150px; perspective-origin: 50% 26%; }
.temblor.sacudida { animation: sacudida .42s ease; }
@keyframes sacudida { 0%, 100% { translate: 0 0; } 20% { translate: -7px 2px; } 45% { translate: 6px -2px; } 70% { translate: -3px 1px; } }
.mundo {
  position: absolute; left: 50%; bottom: calc(var(--k, .75) * -26px); width: 480px; height: 720px; margin-left: -240px;
  transform-origin: 50% 100%; transform: rotateX(var(--tilt)) scale(var(--k, .75));
}
.suelo {
  position: absolute; left: -2200px; right: -2200px; top: -900px; bottom: -80px;
  background-color: #463e36;
  background-image:
    var(--tex-suelo, none),
    linear-gradient(90deg, rgba(20,15,11,.55) 0 2px, transparent 2px),
    linear-gradient(0deg, rgba(20,15,11,.55) 0 2px, transparent 2px),
    repeating-conic-gradient(#4b433a 0 25%, #433b33 0 50%);
  background-size: 144px 144px, 72px 72px, 72px 72px, 144px 144px;
  background-position: 0 0, 18px 0, 0 10px, 18px 10px;
}
.capa { position: absolute; left: 0; top: 0; width: 480px; height: 720px; pointer-events: none; }
svg.capa { overflow: visible; }
.mundo .card { position: absolute; left: 0; top: 0; }
.card.mesa { --w: 50px; box-shadow: 0 0 0 .8px rgba(70,50,30,.45), 0 1px 1px rgba(0,0,0,.45), 0 3px 6px rgba(0,0,0,.28); }
.card.pila { --w: 30px; box-shadow: 0 0 0 1px rgba(70,50,30,.4), 0 1px 2px rgba(0,0,0,.45); }
.card.rival { --w: 32px; box-shadow: 0 0 0 1px rgba(70,50,30,.4), 0 1px 2px rgba(0,0,0,.45); }
.card.mia { --w: 80px; }
.card.oculta { visibility: hidden; }
#filas .card.mirable { pointer-events: auto; cursor: zoom-in; }
#filas .card.mirable:focus-visible { outline: 3px solid var(--oro-2); outline-offset: 2px; }
.card.en-lupa { visibility: hidden; }

/* La carta de cerca */
.lupa {
  position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 16px;
  padding: 16px; background: rgba(10, 7, 5, .74); cursor: zoom-out; outline: none;
  animation: lupa-entra .28s ease both;
}
.lupa.saliendo { animation: lupa-fondo-sale .26s ease forwards; }
.lupa-carta { will-change: transform; }
.lupa .card { --w: min(62vw, 40vh, 290px); box-shadow: 0 0 0 1px rgba(70,50,30,.45), 0 22px 60px rgba(0,0,0,.65), 0 6px 14px rgba(0,0,0,.4); }
.lupa-pie { margin: 0; display: grid; justify-items: center; gap: 3px; text-align: center; font-family: var(--f-body); animation: lupa-pie .3s ease .14s both; }
.lupa.saliendo .lupa-pie { animation: lupa-sale .15s ease forwards; }
.lupa-pie b { font-family: var(--f-display); font-size: 26px; font-weight: 800; color: #fff8e8; line-height: 1.1; }
.lupa-pie span { font-size: 15px; font-weight: 700; color: var(--oro-2); }
.lupa-pie small { font-size: 13px; color: var(--texto-2); margin-top: 4px; }
@keyframes lupa-entra { from { background-color: rgba(10, 7, 5, 0); } }
@keyframes lupa-fondo-sale { to { background-color: rgba(10, 7, 5, 0); } }
@keyframes lupa-sale { to { opacity: 0; } }
@keyframes lupa-pie { from { opacity: 0; transform: translateY(8px); } }
.card.gana { box-shadow: 0 0 0 2px var(--oro), 0 0 12px 2px rgba(240,200,100,.55); }
.card.parda { box-shadow: 0 0 0 2px rgba(240,233,215,.8); }
.platillo { position: absolute; width: 104px; height: 104px; left: 188px; top: 212px; }
.platillo svg { width: 100%; height: 100%; display: block; overflow: visible; }
.abanico-rival { position: absolute; width: 0; height: 0; }
.abanico-rival .card { left: -16px; top: 2px; transform-origin: 50% 0; }
.mano-sujeta { position: absolute; left: -40px; top: -40px; overflow: visible; }
.mano-echa { transition: opacity .15s; }
.abanico-rival.echando .mano-echa { opacity: 0; }
.mano-reposo { transition: opacity .15s; }
.mano-reposo.fuera { opacity: 0; }
.abanico .card {
  left: calc(var(--x) - 40px); top: calc(var(--y) - 59px); transform: rotate(var(--r));
  pointer-events: auto; transition: transform .16s ease, box-shadow .16s ease;
  box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.45);
}
.abanico.activo .card { cursor: pointer; box-shadow: 0 0 0 2.5px var(--oro), 0 0 18px rgba(240,200,100,.45), 0 10px 22px rgba(0,0,0,.45); }
.abanico.activo .card:hover, .abanico.activo .card:focus-visible { transform: rotate(var(--r)) translateY(-16px); outline: none; }
.abanico .card:disabled { cursor: default; }
.mundo.sin-cartas .pulgar, .mundo.sin-cartas .palma { display: none; }
.mundo:not(.sin-cartas) .izq-reposo { display: none; }
.abanico .yemas-fan { position: absolute; left: calc(var(--x) - 40px); top: calc(var(--y) - 59px); width: 80px; height: 118px; transform: rotate(var(--r)); pointer-events: none; }
.yemas-svg { position: absolute; right: -11px; top: 54px; overflow: visible; }
.vuelo { position: absolute; width: 50px; height: 74px; pointer-events: none; z-index: 5; }
.vuelo-carta { position: absolute; inset: 0; }
.vuelo-carta .card { left: 0; top: 0; }
.vuelo-mano { position: absolute; left: 0; top: 0; width: 50px; height: 74px; transform-origin: 50% 50%; }
.mano-vuelo-svg { position: absolute; overflow: visible; }

/* El puñetazo en la mesa del que pierde */
.mesazo { position: absolute; width: 0; height: 0; pointer-events: none; }
.mesazo-puno { position: absolute; left: -36px; top: -42px; width: 72px; height: 96px; transform-origin: 36px 42px; opacity: 0; }
.mesazo-puno svg { display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.mesazo-sombra { position: absolute; left: -30px; top: -22px; width: 60px; height: 52px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); opacity: 0; }

/* Etiquetas con el nombre de cada uno */

/* Los puntos del suelo: qué jugada del reparto va. Un círculo vacío por jugada que se rellena cuando empieza */
.punto {
  position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  border: 2.5px solid rgba(239,229,207,.6); background: rgba(20,15,11,.35);

}

  content: ''; position: absolute; inset: 2px; border-radius: 50%; background: #efe5cf;
  transform: scale(0); transition: transform .55s cubic-bezier(.3,1.5,.5,1) .15s, background-color .4s ease, opacity .4s ease;
}

/* El cenicero */
.cenicero { position: absolute; width: 180px; height: 180px; pointer-events: none; }

#cig-brasa { opacity: .55; transition: opacity .3s; }

.cenicero.apurando #cig-brasa { animation: aviva .7s ease-in-out infinite alternate; }
@keyframes aviva { from { opacity: .75; } to { opacity: 1; } }

.humo { position: absolute; width: 0; height: 0; pointer-events: none; }
.humo i { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, rgba(226,223,216,.5), rgba(226,223,216,0) 70%); filter: blur(2px); opacity: 0; animation: humo 3.4s linear infinite; }
.humo i:nth-child(2) { animation-delay: .7s; --dx: -16px; }

}

/* Luz de la lámpara y viñeta de la cámara */
.luz { position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background:

    radial-gradient(130% 110% at 50% 46%, transparent 52%, rgba(6,4,2,.62) 100%); }

/* Carteles: ¡Truque!, ¡Envido!, ¡Flor!... Entran de golpe (con onda y chispas), se quedan lo justo para leerlos
   y salen volando. Tocándolos se pasa al siguiente. */

  padding: 10px 22px 12px; border-radius: 14px 18px 12px 20px;

  box-shadow: 0 0 0 4px var(--c), 0 18px 40px rgba(0,0,0,.6);
  text-align: center; max-width: 92%; pointer-events: auto; cursor: pointer;
  animation: cartel-entra .5s cubic-bezier(.2,.9,.3,1.3) both, cartel-sale .34s cubic-bezier(.5,0,.9,.4) calc(var(--dur) - .34s) forwards;
}
.cartel::before { content: ''; position: absolute; inset: -6px; border-radius: inherit; border: 4px solid var(--c); opacity: 0; pointer-events: none; animation: onda .7s ease-out .08s; }
.cartel::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 48%, transparent 60%) no-repeat; background-size: 250% 100%; background-position: 130% 0;
  animation: brillo .9s ease-out .35s; }

.cartel span { font-weight: 800; font-size: 15px; }
.cartel.k-envido { --c: var(--espadas); } .cartel.k-truque { --c: var(--copas); } .cartel.k-flor { --c: #a87612; }
.cartel.k-falta { --c: #1c1612; border-color: var(--aviso); box-shadow: 0 0 0 4px var(--aviso), 0 18px 40px rgba(0,0,0,.6); }
.cartel.k-quiero { --c: var(--bastos); } .cartel.k-no { --c: #4a4339; }
@keyframes cartel-entra {
  0% { opacity: 0; transform: scale(2) rotate(-10deg); filter: blur(3px); }
  45% { opacity: 1; transform: scale(.92) rotate(-3deg); filter: blur(0); }
  70% { transform: scale(1.04) rotate(-4.5deg); }
  100% { opacity: 1; transform: scale(1) rotate(-4deg); }
}
@keyframes cartel-sale {
  0% { opacity: 1; transform: scale(1) rotate(-4deg); filter: blur(0); }
  100% { opacity: 0; transform: translateY(-46px) scale(.72) rotate(-9deg); filter: blur(3px); }
}
@keyframes onda { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes brillo { from { background-position: 130% 0; } to { background-position: -40% 0; } }
.chispas { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 2; }
.chispas i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #ffe7a6; box-shadow: 0 0 10px 3px rgba(255,200,90,.75); opacity: 0;
  animation: chispa var(--t) cubic-bezier(.2,.7,.3,1) .05s forwards; }
.chispas i:nth-child(3n) { width: 5px; height: 5px; background: #fff; }
.chispas i:nth-child(4n) { background: #ff9f6a; box-shadow: 0 0 8px 2px rgba(255,120,60,.6); }
@keyframes chispa {

}
/* Aviso de que te han cantado algo (se queda mientras decides, abajo, para no tapar a nadie) */
.reto-capa { position: absolute; bottom: 10px; left: 0; right: 0; z-index: 7; display: grid; justify-items: center; pointer-events: none; padding-inline: 10px; }

.pv.abierto { box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 5.5px var(--t), inset 0 0 0 7px var(--c), 0 0 0 3px #fff3d6, 0 8px 16px rgba(0,0,0,.5); }
.reto.k-envido { --c: var(--espadas); } .reto.k-flor { --c: #a87612; } .reto.k-falta { --c: #1c1612; border-color: var(--aviso); }
